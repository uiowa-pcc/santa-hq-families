/* Santa HQ — Heart and star kid icons */

/* Kid 1: purple star */
.kid-card:nth-child(1) .kid-avatar,
.plan-score.one .plan-score-face,
.morning-summary.one .morning-summary-name > span,
.plan-child.one .plan-face,
.morning-colhead.one .face,
.kid-person[data-kid="1"] > span {
  --kid-symbol: "★";
  --kid-color: #7654bd;
  --kid-bg: #efebff;
}

/* Kid 2: pink heart */
.kid-card:nth-child(2) .kid-avatar,
.plan-score.two .plan-score-face,
.morning-summary.two .morning-summary-name > span,
.plan-child.two .plan-face,
.morning-colhead.two .face,
.kid-person[data-kid="2"] > span {
  --kid-symbol: "♥";
  --kid-color: #d56d90;
  --kid-bg: #fce9ef;
}

/* Apply the new icons throughout the app */
:is(
  .kid-avatar,
  .plan-score-face,
  .morning-summary-name > span,
  .plan-child-header .plan-face,
  .morning-colhead .face,
  .kid-person > span
) {
  display: grid;
  place-items: center;
  position: relative;
  background: var(--kid-bg, #fce9ef) !important;
  border-radius: 14px;
}

:is(
  .kid-avatar,
  .plan-score-face,
  .morning-summary-name > span,
  .plan-child-header .plan-face,
  .morning-colhead .face,
  .kid-person > span
) > img {
  display: none !important;
}

:is(
  .kid-avatar,
  .plan-score-face,
  .morning-summary-name > span,
  .plan-child-header .plan-face,
  .morning-colhead .face,
  .kid-person > span
)::after {
  content: var(--kid-symbol);
  color: var(--kid-color);
  font-family: Georgia, serif;
  font-size: 28px;
  line-height: 1;
}

const appState={page:'dashboard',gifts:[],search:'',filterKid:'all',filterStatus:'all',filterCat:'all',giftImage:'',editingId:null,online:false,user:null,cloud:null,cloudUnsubs:[],loading:false,metaReceived:false,fromSharedLink:null,messages:[],kidActive:false,kidChoice:'Wish update',kidSelected:'1',kidMode:'talk',morningPrices:false,morningCompact:true,giftView:'ideas',compareIds:[]};

function configuredChildren(){
 const raw=Array.isArray(settings.children)&&settings.children.length?settings.children:null;
 if(!raw)return [{id:'1',name:String(settings.child1||'Child 1'),icon:'star',budget:cents(settings.budget1)},{id:'2',name:String(settings.child2||'Child 2'),icon:'heart',budget:cents(settings.budget2)}];
 const ids=new Set();return raw.filter(x=>x&&/^([1-6])$/.test(String(x.id))&&!ids.has(String(x.id))&&ids.add(String(x.id))).slice(0,6).map((c,i)=>({id:String(c.id),name:String(c.name||'Child '+(i+1)).slice(0,50),icon:(CHILD_ICONS[c.icon]||ELF_ICONS[c.icon])?c.icon:CHILD_ICON_NAMES[i%CHILD_ICON_NAMES.length],budget:cents(c.budget),interests:String(c.interests||'').slice(0,350),favorites:String(c.favorites||'').slice(0,350),shareFavorites:c.shareFavorites===true}));
}

 if(ELF_ICONS[icon])return `<span class="${className} elf-avatar" data-elf="${icon}" title="${ELF_ICONS[icon]}" role="img" aria-label="${ELF_ICONS[icon]}"></span>`;
 const token=CHILD_ICONS[icon]||CHILD_ICONS.star;
 return `<span class="${className}" title="${token.label}" aria-label="${token.label}" style="--child-accent:${token.color};--child-tint:${token.tint}">${token.symbol}</span>`;

function syncLegacyChildren(){const cs=configuredChildren();if(Array.isArray(settings.children)&&settings.children.length){settings.child1=cs[0]?.name||'Child 1';settings.child2=cs[1]?.name||'Child 2';settings.budget1=cs[0]?.budget||0;settings.budget2=cs[1]?.budget||0;}}

let settings={...DEFAULT};let db=null,toastTimer;
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeLink(v){try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:''}catch{return ''}}

function cents(x){return Math.max(0,Number(x)||0)}
function giftTotal(g){return cents(g.price)*Math.max(1,Number(g.qty)||1)+cents(g.extra)}
function giftPriceLabel(g){return g.price===null||g.price===undefined||g.price===''?'Price TBD':money(giftTotal(g))}

function storeNameFromLink(link){try{const h=new URL(safeLink(link)).hostname.replace(/^www\./,'');const names={'amazon.com':'Amazon','target.com':'Target','walmart.com':'Walmart','lego.com':'LEGO','sephora.com':'Sephora','bestbuy.com':'Best Buy','costco.com':'Costco'};return Object.entries(names).find(([k])=>h===k||h.endsWith('.'+k))?.[1]||h}catch{return ''}}
function savedPrice(g){return g.price===null||g.price===undefined||g.price===''?null:cents(g.price)}

function dealCheckedLabel(g){if(!g.dealPriceCheckedAt)return 'Not refreshed yet';const d=new Date(g.dealPriceCheckedAt);return Number.isNaN(d.valueOf())?'Last check unknown':'Checked '+d.toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}

function planned(g){return g.status!=='Idea'}
function totals(){let spent=0,plannedCost=0,toShop=0,wrapped=0,ordered=0;for(const g of appState.gifts){const n=giftTotal(g);if(bought(g))spent+=n;if(planned(g))plannedCost+=n;if(g.status==='To buy')toShop++;if(g.status==='Wrapped')wrapped++;if(g.status==='Ordered')ordered++;}return {spent,plannedCost,toShop,wrapped,ordered,total:appState.gifts.length}}

function catEmoji(v){const art=({"Big gift":"present","Regular gift":"present","Stocking":"stocking","Experience":"ornament","Shared / family":"tree"})[v]||"present";return `<img src="./art/${art}.svg" alt="" class="category-art" loading="lazy">`}

function dbExec(mode,action){return new Promise((resolve,reject)=>{const t=db.transaction('gifts',mode);let req=action(t.objectStore('gifts'));if(req){req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)}else {t.oncomplete=()=>resolve();t.onerror=()=>reject(t.error)}})}

  button.addEventListener('click',undoBoardMove);
  el.append(' ',button);
 }
 el.classList.add('show');
 clearTimeout(toastTimer);

function daysToChristmas(date=new Date()){
  const year=date.getFullYear(), month=date.getMonth(), day=date.getDate();
  const nextYear=month===11&&day>25?year+1:year;
  return (Date.UTC(nextYear,11,25)-Date.UTC(year,month,day))/86400000;

 const next={...g,giftPlacement:place,category:categoryFromPlacement(place,g.category,prior),categoryBeforeStocking:prior};
 next.planLane=placementLane(next,place);
 return next;
}

let quickImportImage='';
function amazonLink(value){
 try{
  const u=new URL(value);
  return u.protocol==='https:'&&['amazon.com','www.amazon.com','smile.amazon.com','m.amazon.com','a.co','amzn.to','www.amzn.to'].includes(u.hostname);
 }catch{return false}
}
async function amazonDetails(link){
 const response=await fetch('/api/private/amazon-lookup',{
  method:'POST',credentials:'same-origin',cache:'no-store',
  headers:{'Content-Type':'application/json'},body:JSON.stringify({link}),
  signal:AbortSignal.timeout(90000)
 });
 const result=await response.json().catch(()=>({}));
 if(!response.ok||!result.ok)throw Error(result.error||'Amazon lookup is unavailable.');
 return result;
}
function applyAmazonDetails(form,fields,details,link){
 const input=form.querySelector(fields.link);
 if(!activeGiftLinkForm(form,input,link))return false;
 const title=form.querySelector(fields.name),price=form.querySelector(fields.price);
 input.value=details.link;
 if(!title.value.trim()||title.value===form.sharedTitle||title.value===form.amazonQuote?.title){
  if(details.title)title.value=details.title;
 }
 if(price.value===''||price.value===form.amazonQuote?.price?.toFixed(2)){
  price.value=Number.isFinite(details.price)?details.price.toFixed(2):'';
 }
 form.amazonQuote=details;
 return true;
}
function activeGiftLinkForm(form,input,link){
 return form.isConnected&&document.getElementById('overlay').classList.contains('open')&&safeLink(input.value)===link;
}
function amazonLookupStatus(details){
 return Number.isFinite(details.price)?`Amazon price checked at ${money(details.price)} per item. Review the selected version before saving.`:'Amazon details loaded. No current price was returned.';
}

async function quickLookupLink(){
 const form=document.getElementById('recipientQuickForm');
 const input=form.querySelector('#recipientQuickLink');
 const raw=input.value;
 const url=safeLink(raw),status=document.getElementById('recipientQuickLinkStatus');
 if(!url){if(status)status.textContent='Paste a valid https:// store link.';return;}
 const button=document.querySelector('[data-action="quick-lookup"]');if(button)button.disabled=true;
 if(status)status.textContent='Finding available product details…';
 if(amazonLink(url)){
  try{
   const details=await amazonDetails(url);
   if(applyAmazonDetails(form,{link:'#recipientQuickLink',name:'#recipientQuickName',price:'#recipientQuickPrice'},details,url)){
    quickImportImage=safeLink(details.image);
    status.textContent=amazonLookupStatus(details);
   }
  }catch(err){if(activeGiftLinkForm(form,input,url))status.textContent=err.message||'Could not read that Amazon product.';}
  finally{button.disabled=false;}
  return;
 }
 try{
  const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),10000);
  let response;
  try{response=await fetch('https://api.microlink.io?url='+encodeURIComponent(url),{signal:controller.signal});}
  finally{clearTimeout(timeout)}
  const data=await response.json();
  if(!response.ok||data.status!=='success'||!data.data)throw new Error('No product details');
  if(!activeGiftLinkForm(form,input,url))return;
  const title=String(data.data.title||'').split(' | ')[0].trim().slice(0,160);
  const name=document.getElementById('recipientQuickName');if(name&&!name.value.trim()&&title)name.value=title;
  quickImportImage=safeLink(data.data.image?.url)||'';
  if(status)status.textContent='Name/picture imported where available. Enter the price yourself; it is not a live price.';
 }catch(err){if(status)status.textContent='The store blocked automatic details. Your link can still be saved; enter a gift name.';}
 finally{if(button)button.disabled=false;}
}

async function moveToPlan(id,lane,beforeId=null){
 if(!planLanes().includes(lane))return;
 const original=appState.gifts.find(g=>g.id===id);if(!original)return;
 const oldLane=getPlanLane(original),now=new Date().toISOString();
 const place=lane==='ideas'?'undecided':lane.endsWith('stocking')?'stocking':'tree';
 let draft={...original,updatedAt:now};
 if(lane==='shared')draft.kid='both';
 else if(lane!=='ideas')draft.kid=lane.split('-')[0];
 draft=applyPlacement(draft,place);
 let members=sortedPlanGifts(lane).filter(g=>g.id!==id);let at=beforeId?members.findIndex(g=>g.id===beforeId):-1;
 if(at<0)at=members.length;members.splice(at,0,draft);
 const changed=[];
 for(const [i,item] of members.entries()){
   const previous=appState.gifts.find(g=>g.id===item.id),next={...item,planOrder:(i+1)*100};
   if(!previous||JSON.stringify(previous)!==JSON.stringify(next)){next.updatedAt=now;changed.push(next)}
 }
 if(oldLane!==lane){sortedPlanGifts(oldLane).filter(g=>g.id!==id).forEach((g,i)=>{if(g.planOrder!==(i+1)*100)changed.push({...g,planOrder:(i+1)*100,updatedAt:now})})}
 const versions=new Map(changed.map(g=>[g.id,g]));
 try{await Promise.all(changed.map(putGift));appState.gifts=appState.gifts.map(g=>versions.get(g.id)||g);render();showToast('Gift moved; purchase status kept');await Promise.all(changed.map(cloudPutGift));}
 catch(err){console.error(err);showToast('Could not save this move.');}
}

 catch(err){console.error(err);showToast('Could not lock in this gift.');render();}

async function sqMove(id,k,place,before=null){let g=appState.gifts.find(x=>x.id===id);if(!g||!([...childIds(),'both'].includes(k))||!['undecided','tree','stocking'].includes(place))return;if(k==='both'&&place==='stocking'){showToast('Choose one child for a stocking gift, or add the idea separately for each child.');return;}
let next=applyPlacement({...g,kid:k},place);if(place==='undecided'){next.lockedIn=false;if(next.status==='To buy')next.status='Idea'}
let siblings=appState.gifts.filter(x=>x.id!==id&&x.kid===k&&giftPlacement(x)===place).sort((a,b)=>(Number(a.planOrder)||0)-(Number(b.planOrder)||0));let index=before?siblings.findIndex(x=>x.id===before):-1;siblings.splice(index<0?siblings.length:index,0,next);

let sqDragging=null;
function sqPointerDown(event){
 const handle=event.target.closest?.('[data-sq-grab]');
 const card=handle?.closest('[data-sq-card]');
 if(!card||sqDragging||appState.page!=='gifts'||event.button!==0||!event.isPrimary)return;
 if(handle.tagName!=='BUTTON')event.preventDefault();
 sqDragging={id:handle.dataset.sqGrab,pointer:event.pointerId,card,handle,x:event.clientX,y:event.clientY,startX:event.clientX,startY:event.clientY};
 document.addEventListener('pointermove',sqPointerMove,{passive:false});
 document.addEventListener('pointerup',sqPointerUp);
 document.addEventListener('pointercancel',sqPointerCancel);
 document.addEventListener('keydown',sqDragEscape);
}

function sqDragEscape(event){
 if(event.key==='Escape')sqPointerEnd(true);
}

function sqDropTarget(drag){
 const zone=document.elementFromPoint(drag.x,drag.y)?.closest('[data-sq-zone]');
 const gift=appState.gifts.find(g=>g.id===drag.id);
 if(!zone||!gift)return null;
 const kid=zone.dataset.sqZone;
 const place=zone.dataset.sqPlace||(
  kid==='unassigned'?'undecided':kid==='both'&&giftPlacement(gift)==='stocking'?'tree':giftPlacement(gift)
 );
 if(kid==='both'&&place==='stocking')return null;
 const samePile=gift.kid===kid&&giftPlacement(gift)===place;
 if(samePile&&!zone.classList.contains('gift-simple-pile')&&!zone.classList.contains('gift-morning-pile'))return null;
 const cards=[...zone.querySelectorAll('[data-sq-card]')].filter(card=>
  card!==drag.card&&(!samePile||card.dataset.confirmed===drag.card.dataset.confirmed)
 );
 const before=cards.find(card=>{
  const rect=card.getBoundingClientRect();
  return drag.y<rect.top+rect.height/2;
 });
 return {zone,kid,place,before};
}

function sqDrawDrag(){
 const drag=sqDragging;
 if(!drag?.ghost)return;
 const edge=85;
 if(drag.y<edge)window.scrollBy(0,-12);
 else if(drag.y>innerHeight-edge&&!document.elementFromPoint(drag.x,drag.y)?.closest('.gift-drop-dock'))window.scrollBy(0,12);
 const target=sqDropTarget(drag);
 if(target?.zone!==drag.target?.zone){
  drag.target?.zone.classList.remove('sq-hover');
  target?.zone.classList.add('sq-hover');
 }
 if(target?.before!==drag.target?.before){
  drag.target?.before?.classList.remove('sq-before');
  target?.before?.classList.add('sq-before');
 }
 drag.target=target;
 drag.frame=requestAnimationFrame(sqDrawDrag);
}

function sqPointerMove(event){
 const drag=sqDragging;
 if(!drag||drag.pointer!==event.pointerId)return;
 drag.x=event.clientX;
 drag.y=event.clientY;
 if(!drag.ghost){
  if(Math.hypot(drag.x-drag.startX,drag.y-drag.startY)<7)return;
  drag.ghost=document.createElement('div');
  drag.ghost.className='sq-ghost gift-drag-preview';
  drag.ghost.textContent=drag.card.querySelector('strong')?.textContent||'Gift';
  drag.ghost.setAttribute('aria-hidden','true');
  document.body.append(drag.ghost);
  document.body.classList.add('gift-dragging');
  drag.card.classList.add('sq-source');
  drag.frame=requestAnimationFrame(sqDrawDrag);
 }
 event.preventDefault();
 drag.ghost.style.left=Math.max(8,Math.min(innerWidth-drag.ghost.offsetWidth-8,drag.x+12))+'px';
 drag.ghost.style.top=Math.max(8,drag.y-48)+'px';
}

function sqPointerEnd(cancel){
 const drag=sqDragging;
 if(!drag)return;
 const target=!cancel&&drag.ghost?sqDropTarget(drag):null;
 const droppedOnSource=target&&document.elementFromPoint(drag.x,drag.y)?.closest('[data-sq-card]')===drag.card;
 sqDragging=null;
 cancelAnimationFrame(drag.frame);
 document.removeEventListener('pointermove',sqPointerMove);
 document.removeEventListener('pointerup',sqPointerUp);
 document.removeEventListener('pointercancel',sqPointerCancel);
 document.removeEventListener('keydown',sqDragEscape);
 drag.ghost?.remove();
 drag.card.classList.remove('sq-source');
 drag.target?.zone.classList.remove('sq-hover');
 drag.target?.before?.classList.remove('sq-before');
 document.body.classList.remove('gift-dragging');
 if(!drag.ghost)return;
 window.addEventListener('click',event=>{event.preventDefault();event.stopImmediatePropagation();},{capture:true,once:true,signal:AbortSignal.timeout(350)});
 if(!target||droppedOnSource)return;
 void moveBoardGift(drag.id,target.kid,target.place,target.before?.dataset.sqCard,appState.giftView!=='compare');
}
function sqPointerUp(event){
 if(event.pointerId!==sqDragging?.pointer)return;
 sqDragging.x=event.clientX;
 sqDragging.y=event.clientY;
 sqPointerEnd(false);
}
function sqPointerCancel(event){
 if(event.pointerId===sqDragging?.pointer)sqPointerEnd(true);
}

 modalOpen('Move gift',`<p>${escapeHTML(g.name)}</p>${reorder}<div class="sq-move-grid">${[...childIds(),'both'].map(k=>`<section><strong>${escapeHTML(kidName(k))}</strong><div>${places.filter(([place])=>!(k==='both'&&place==='stocking')&&(k!==g.kid||place!==giftPlacement(g))).map(([place,label])=>`<button type="button" data-action="board-move" data-id="${escapeHTML(id)}" data-kid="${escapeHTML(k)}" data-place="${place}">${label}</button>`).join('')}</div></section>`).join('')}</div>`,`<button type="button" class="secondary" data-action="close">Cancel</button>`);

async function saveBoardMove(changed,viewDestination=null){
 await dbExec('readwrite',store=>{changed.forEach(gift=>store.put(gift));});
 const updates=new Map(changed.map(gift=>[gift.id,gift]));
 appState.gifts=appState.gifts.map(gift=>updates.get(gift.id)||gift);
 if(viewDestination&&appState.page==='gifts'&&appState.giftView!=='compare'){
  boardRecipient=viewDestination.kid;
  boardOpenPiles.add(viewDestination.place);
  localStorage.setItem('santa-board-recipient',boardRecipient);
 }
 render();
 await Promise.all(changed.map(cloudPutGift));
}

async function moveBoardGift(id,kid,place,before=null,showDestination=false){
 if(boardMoveBusy||!validRecipient(kid)||!Object.hasOwn(giftPileLabels,place)||(kid==='both'&&place==='stocking'))return;
 const gift=appState.gifts.find(g=>g.id===id);
 if(!gift||id===before)return;
 const siblings=wbGifts(kid,place).filter(g=>g.id!==id);
 const destination=siblings.findIndex(g=>g.id===before);
 const moved=gift.kid===kid&&giftPlacement(gift)===place?gift:applyPlacement({...gift,kid},place);
 if(place==='undecided'&&moved!==gift){
  moved.lockedIn=false;
  if(moved.status==='To buy')moved.status='Idea';
 }
 siblings.splice(destination<0?siblings.length:destination,0,moved);
 const now=new Date().toISOString(),previous=[];
 const changed=siblings.flatMap((g,index)=>{
  const original=appState.gifts.find(item=>item.id===g.id);
  const planOrder=(index+1)*100;
  if(g===original&&g.planOrder===planOrder)return [];
  previous.push(original);
  return [{...g,planOrder,updatedAt:now}];
 });
 if(!changed.length)return;
 boardMoveBusy=true;
 try{
  await saveBoardMove(changed,showDestination?{kid,place}:null);
  boardUndo={previous,changed,source:showDestination?{kid:gift.kid,place:giftPlacement(gift)}:null};
  showToast(showDestination?`Moved to ${kidName(kid)} · ${giftPileLabels[place]}`:'Gift moved',true);
 }catch(error){console.error(error);showToast('Could not move gift');}
 finally{boardMoveBusy=false;}
}

async function undoBoardMove(){
 if(boardMoveBusy||!boardUndo)return;
 const {previous,changed}=boardUndo;
 if(changed.some(g=>appState.gifts.find(item=>item.id===g.id)?.updatedAt!==g.updatedAt)){
  boardUndo=null;
  showToast('This pile changed. Open the gift to move it again.');
  return;
 }
 boardMoveBusy=true;
 try{
  await saveBoardMove(previous.map(g=>({...g,updatedAt:new Date().toISOString()})),boardUndo.source);
  boardUndo=null;
  showToast('Move undone');
 }catch(error){console.error(error);showToast('Could not undo the move',true);}
 finally{boardMoveBusy=false;}
}

function reorderMorningGift(id,direction){
 const gift=appState.gifts.find(g=>g.id===id);
 if(!gift)return;
 const siblings=wbGifts(gift.kid,morningPile);
 const visible=siblings.filter(morningConfirmed);
 const index=visible.findIndex(g=>g.id===id);
 const neighbor=visible[index+direction];
 if(index<0||!neighbor)return;
 const before=direction<0?neighbor.id:siblings[siblings.indexOf(neighbor)+1]?.id;
 void moveBoardGift(id,gift.kid,morningPile,before);
}

function wishNameFromLetter(text){
 const raw=String(text||'').replace(/\s+/g,' ').trim();
 const match=raw.match(/(?:^|[.!?]\s+|,\s*)(?:Dear Santa[,!]?\s*)?(?:I want|I would like|I'd like|I wish for|Please bring me|Can I have)\s+(.+?)(?:[.!?]|$)/i);
 if(!match)return '';
 const name=match[1].trim().replace(/^(?:a|an|some)\s+/i,'');
 if(!name||name.length>100||/[,;]|\s+(?:and|or)\s+/i.test(name))return '';
 return name.charAt(0).toUpperCase()+name.slice(1);
}

}

async function smallKidPhoto(file){

function setupKidCanvas(){const canvas=document.getElementById('kidDrawingCanvas');if(!canvas)return;const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.lineCap='round';ctx.lineJoin='round';if(kidDrawing){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,canvas.width,canvas.height);img.src=kidDrawing}
const coords=e=>{const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}};
canvas.addEventListener('pointerdown',e=>{e.preventDefault();try{canvas.setPointerCapture(e.pointerId)}catch{}kidCanvasUndo.push(ctx.getImageData(0,0,canvas.width,canvas.height));if(kidCanvasUndo.length>10)kidCanvasUndo.shift();const c=coords(e);kidIsDrawing=true;kidDrawTouched=true;ctx.beginPath();ctx.strokeStyle=kidDrawColor;ctx.lineWidth=13;ctx.moveTo(c.x,c.y);ctx.lineTo(c.x+.2,c.y+.2);ctx.stroke()});
canvas.addEventListener('pointermove',e=>{if(!kidIsDrawing)return;e.preventDefault();const c=coords(e);ctx.lineTo(c.x,c.y);ctx.stroke()});
const stop=e=>{if(!kidIsDrawing)return;kidIsDrawing=false;kidDrawing=canvas.toDataURL('image/jpeg',.64)};canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop);canvas.addEventListener('lostpointercapture',stop)}
function kidCanvasAction(action){const canvas=document.getElementById('kidDrawingCanvas');if(!canvas)return;const ctx=canvas.getContext('2d');if(action==='kid-undo'&&kidCanvasUndo.length){ctx.putImageData(kidCanvasUndo.pop(),0,0);kidDrawing=canvas.toDataURL('image/jpeg',.64);kidDrawTouched=!!kidCanvasUndo.length}else if(action==='kid-clear'){ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);kidCanvasUndo=[];kidDrawing='';kidDrawTouched=false} }

async function startKidRecording(){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){kidRecordUI('Recording needs Safari or Chrome on a secure website (https).');return}try{kidAudio='';const preview=document.getElementById('kidAudioPreview');if(preview)preview.innerHTML='';kidStream=await navigator.mediaDevices.getUserMedia({audio:true});const formats=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg'];let format=formats.find(v=>MediaRecorder.isTypeSupported?.(v));kidRecorder=format?new MediaRecorder(kidStream,{mimeType:format}):new MediaRecorder(kidStream);kidRecordParts=[];kidSeconds=0;kidRecorder.ondataavailable=e=>{if(e.data.size)kidRecordParts.push(e.data)};kidRecorder.onstop=async()=>{stopKidDevices();try{const blob=new Blob(kidRecordParts,{type:kidRecorder.mimeType||kidRecordParts[0]?.type||'audio/mp4'});if(blob.size>510000){kidRecordUI('This recording is a little big. Please try a shorter message.','Try again');return}const file=new FileReader();file.onload=()=>{kidAudio=String(file.result);const safe=safeKidMedia(kidAudio,'audio');if(!safe){kidRecordUI('This audio type could not be saved on this device. Try a shorter recording.','Try again');return}kidRecordUI('Lovely! Listen to your message before you send it.','Record again');const box=document.getElementById('kidAudioPreview');if(box)box.innerHTML=`<audio controls preload="metadata" src="${safe}"></audio><button class="kid-text-link" type="button" data-action="kid-redo-record">↻ Record again</button>`};file.readAsDataURL(blob)}catch{kidRecordUI('Could not save this recording. Try again.','Try again')}};kidRecorder.start();kidRecordUI('Rec Recording… 0 of 20 seconds','Tap to stop');kidRecordTimer=setInterval(()=>{kidSeconds++;kidRecordUI('Rec Recording… '+kidSeconds+' of 20 seconds','Tap to stop');if(kidSeconds>=20)finishKidRecording()},1000)}catch(e){stopKidDevices();kidRecordUI('Microphone access was unavailable. Allow access in Safari, or try Draw.','Try microphone')}}

function kidDictate(){const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;const input=document.getElementById('kidMessage');if(!Speech){if(input){input.focus();showToast('Tap the microphone on your keyboard to dictate.')};return}if(kidSpeech){try{kidSpeech.stop()}catch{}kidSpeech=null;return}try{const recognizer=new Speech();recognizer.lang='en-US';recognizer.interimResults=false;recognizer.maxAlternatives=1;recognizer.onresult=e=>{const words=e.results?.[0]?.[0]?.transcript||'';if(input)input.value=(input.value+' '+words).trim();const help=document.getElementById('kidDictationHelp');if(help)help.textContent=' Words added!'};recognizer.onerror=()=>{const help=document.getElementById('kidDictationHelp');if(help)help.textContent='Try the microphone on your iPhone keyboard instead.'};recognizer.onend=()=>{kidSpeech=null};kidSpeech=recognizer;recognizer.start();const help=document.getElementById('kidDictationHelp');if(help)help.textContent='Talk Listening…'}catch(e){kidSpeech=null;showToast('Try using the microphone on your keyboard instead.')}}

function updateTraditions(items){settings.traditions=items;saveSettingsLocal();modalClose();render();}
function saveTradition(event){
  event.preventDefault();const form=new FormData(event.target),name=String(form.get('name')||'').trim();
  if(!name){showToast('Enter a tradition name.');return;}
  const items=settings.traditions||[],old=items.find(t=>t.id===form.get('traditionId'));
  const item={...old,id:old?.id||makeId(),name,priority:Number(form.get('priority')),date:String(form.get('date')||''),time:String(form.get('time')||''),notes:String(form.get('notes')||'').trim(),done:old?.done||false};
  const wantCalendar=event.submitter?.value==='calendar';
  // A saved date should be visible immediately, even when the user was viewing another month.
  if(item.date&&/^\d{4}-\d{2}-\d{2}$/.test(item.date)){
   appState.traditionMonth=item.date.slice(0,7);
   appState.traditionSelectedId=null;
  }else if(wantCalendar){
   // Next tap on a calendar day schedules the newly created tradition without removing it from the checklist.
   appState.traditionSelectedId=item.id;
  }else if(appState.traditionSelectedId===item.id){appState.traditionSelectedId=null;}
  appState.holidayView='traditions';
  updateTraditions(items.filter(t=>t.id!==item.id).concat(item));
  showToast(item.date?`${name} added to ${traditionDateLabel(item.date)}`:wantCalendar?'Tap a day on the calendar to schedule it':'Added to your checklist');
  if(wantCalendar||item.date){requestAnimationFrame(()=>document.querySelector('.tp-calendar-panel')?.scrollIntoView({behavior:'smooth',block:'nearest'}));}
}
function traditionSchedule(id,date){
  const items=settings.traditions||[],item=items.find(t=>t.id===id);if(!item)return;
  if(date!==''&&!/^\d{4}-\d{2}-\d{2}$/.test(date))return;
  if(date)appState.traditionMonth=date.slice(0,7);
  appState.traditionSelectedId=null;updateTraditions(items.map(t=>t.id===id?{...t,date}:t));
  showToast(date?`${item.name} added to ${traditionDateLabel(date)}`:`${item.name} removed from the calendar`);
}
function traditionAction(action,id,el){
  const items=settings.traditions||[];
  if(action==='tradition-new'){openTradition();return;}
  if(action==='tradition-month'){const [y,m]=traditionMonth().split('-').map(Number);const d=new Date(y,m-1+Number(el?.dataset.offset||0),1);appState.traditionMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;render();return;}
  if(action==='tradition-today'){appState.traditionMonth=null;render();return;}
  if(action==='tradition-unpick'){appState.traditionSelectedId=null;render();return;}
  if(action==='tradition-day'){
    const date=el?.dataset.date;
    if(!date)return;
    if(appState.traditionSelectedId){traditionSchedule(appState.traditionSelectedId,date);}else openTradition({},'',date);
    return;
  }
  if(action==='tradition-example'){
    const name=traditionExamples[Number(id)];if(!name)return;
    if(items.some(t=>t.name.toLowerCase()===name.toLowerCase())){showToast('That idea is already on your list.');return;}
    updateTraditions([...items,{id:makeId(),name,priority:1,date:'',time:'',notes:'',done:false}]);showToast('Added to your wish list');return;
  }
  const item=items.find(t=>t.id===id);if(!item)return;
  if(action==='tradition-pick'){appState.traditionSelectedId=appState.traditionSelectedId===id?null:id;render();return;}
  if(action==='tradition-priority'){updateTraditions(items.map(t=>t.id===id?{...t,priority:(Number(t.priority??1)+1)%3}:t));return;}
  if(action==='tradition-unschedule'){traditionSchedule(id,'');return;}
  if(action==='tradition-edit'){openTradition(item);return;}
  if(action==='tradition-toggle'){updateTraditions(items.map(t=>t.id===id?{...t,done:!t.done}:t));return;}

function parsePastedGifts(draft){
 return String(draft||'').split(/\r?\n/).map(line=>{
  const text=line.trim().replace(/^(?:[-*•]|\d+[.)])\s+/, '');
  const status=/^(?:✓|✔|\[x\])/i.test(text)?'Bought':'Idea';
  const [name,...notes]=text.replace(/^(?:✓|✔|\[[ x]\])\s*/i,'').split('|');
  return {name:name.trim().slice(0,160),notes:notes.join('|').trim(),status};
 }).filter(gift=>gift.name);
}

 return `${gift.kid}:${String(gift.name||'').trim().replace(/\s+/g,' ').toLowerCase()}`;

}

  ${card.copyPair?`<div class="paste-duplicate-message">Separate stocking gift ${card.copyRole==='first'?1:2} of 2. You can edit each gift independently.${card.copyRole==='second'?'<button type="button" class="plain-btn" data-action="paste-remove-copy">Remove copy</button>':''}</div>`:

function pasteDuplicateFlags(){

  }).join('');

async function savePastedGifts(){
 if(!pasteSession)return;
 pasteReviewChoices();
 const selected=pasteSession.cards.filter(c=>!c.saved&&pasteSession.choices[c.cardId]);
 if(!selected.length){showToast('Select at least one gift to save.');return;}
 const button=document.querySelector('[data-action="paste-save"]');if(button)button.disabled=true;
 let saved=0;
 try{
  for(const card of selected){
   const gift=newIdeaGift({name:card.name,kid:card.kid,category:card.category,price:card.price,notes:card.notes});
   gift.id=card.savedGiftId||(card.savedGiftId=makeId());
   gift.status=card.status;gift.lockedIn=card.status!=='Idea';gift.planLane=suggestPlanLane(gift);
   await putGift(gift);
   appState.gifts=appState.gifts.filter(g=>g.id!==gift.id).concat(gift);
   card.saved=true;saved++;
   await cloudPutGift(gift);
  }
  modalClose();render();showToast(`Saved ${saved} ${saved===1?'gift':'gifts'}`);
 }catch(error){
  console.error(error);render();renderPasteReview();

 }finally{if(button?.isConnected)button.disabled=false;}

async function refreshGiftPrice(id,{quiet=false}={}){
 const g=appState.gifts.find(item=>item.id===id);
 if(!g||bought(g)||(!g.watchDeal&&!amazonLink(g.link)))return {ok:false,reason:'This gift is unavailable for a price check.'};

 try{
  if(window.SantaFamilies?.queueCount?.()>0){await window.SantaFamilies.refresh();if(window.SantaFamilies.queueCount()>0)throw Error('This gift is still syncing. Try Refresh again shortly.');}
  const response=await fetch('/api/private/price-check',{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({giftId:g.id}),signal:AbortSignal.timeout(95000)});
  let payload={};try{payload=await response.json()}catch{}
  if(!response.ok)throw Error(payload.error||'This store price could not be checked.');
  if(!Number.isFinite(Number(payload.price))||Number(payload.price)<=0)throw Error('The retailer did not return a usable price.');
  const current=appState.gifts.find(item=>item.id===id);
  if(window.SANTA_FAMILY_ID!==family||!current||current.link!==g.link||bought(current)){
   throw Error('The gift changed during the lookup. Try refreshing it again.');
  }
  const update={...current,dealLatestPrice:Number(payload.price),dealPriceCheckedAt:payload.checkedAt||new Date().toISOString(),dealPriceSource:String(payload.source||'Retailer API').slice(0,100),updatedAt:new Date().toISOString()};
  await putGift(update);appState.gifts=appState.gifts.map(item=>item.id===id?update:item);await cloudPutGift(update);
  if(!quiet)showToast(`Checked price: ${money(update.dealLatestPrice)} · ${update.dealPriceSource}`);
  return {ok:true};
 }catch(err){if(!quiet)showToast(err.message||'Could not refresh price. Open store to check.');return {ok:false,reason:err.message||'Price unavailable'};}
}

// These are examples of characters that appear in illuminated holiday displays;
// the family can also add any character they've spotted locally.
const HUNT_CHARACTER_LIBRARY=[
 'Mickey Mouse','Minnie Mouse','Winnie-the-Pooh','The Grinch','Snoopy','Olaf',
 'Bluey','Bingo (Bluey)','Stitch','Hello Kitty','Rudolph','Frosty the Snowman',
 'Jack Skellington','Zero (Nightmare Before Christmas)','Grogu (Baby Yoda)',
 'The Mandalorian','Minion','Charlie Brown','Woodstock','Sally Brown',
 'Max (The Grinch)','Cindy Lou Who','Scooby-Doo','Elsa','Anna','The Abominable Snow Monster',
 'Bumble','Buddy the Elf','Pikachu','Peppa Pig','Elmo','Oscar the Grouch',
 'Kermit the Frog','SpongeBob SquarePants','Patrick Star','Mario','Yoshi',
 'The Nutcracker','Gingerbread Man','The Polar Express train','Donald Duck',
 'Goofy','Pluto','Winnie-the-Pooh and Piglet','Chase (PAW Patrol)',
 'Marshall (PAW Patrol)','Tigger','Eeyore','Simba'
];
const HUNT_DEFAULT_CHARACTERS=['Mickey Mouse','Winnie-the-Pooh','The Grinch','Snoopy','Olaf'];
// The build writes hunt-images/manifest.json from uploaded picture filenames.
// Fixed decorations are picture replacements; every OTHER named photo becomes
// a selectable character, including names not in the built-in suggestion list.
const HUNT_FIXED_PHOTO_SLUGS=new Set([
 'christmas-tree','glowing-star','candy-cane','santa-claus','snowman','reindeer',
 'holiday-wreath','big-light-up-gift','christmas-elf','icicle-lights','colorful-roof',
 'gingerbread-person','penguin','glowing-snowflake','santa-sleigh','pink-or-purple-lights',
 'giant-inflatable','giant-ornament','nativity-scene','light-up-mailbox',
 'music-synced-lights','holiday-projector','chasing-light-pattern',
 'light-tunnel-or-arch','lights-spelling-a-word'
]);
const huntCharacterSlug=name=>String(name||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const huntCharacterNamesBySlug=new Map(HUNT_CHARACTER_LIBRARY.map(name=>[huntCharacterSlug(name),name]));
let huntUploadedCharacters=[];
let huntCharactersLoading=false;
function huntCharacterFromFilename(slug){
 // Preserve the intended spelling of characters already in the suggestion list.
 const known=huntCharacterNamesBySlug.get(slug);
 if(known)return known;
 return slug.split('-').filter(Boolean).map(word=>word.charAt(0).toUpperCase()+word.slice(1)).join(' ');
}
async function loadUploadedHuntCharacters(){
 if(huntCharactersLoading)return;
 huntCharactersLoading=true;
 try{
  // no-store means the chooser discovers new pictures after GitHub/Cloudflare deploys.
  const response=await fetch('./hunt-images/manifest.json',{cache:'no-store'});
  if(!response.ok)throw Error('Hunt photo catalog unavailable');
  const map=await response.json();
  if(!map||typeof map!=='object'||Array.isArray(map))throw Error('Invalid hunt photo catalog');
  const incoming=[];
  for(const [slug,url] of Object.entries(map)){
   if(!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug)||HUNT_FIXED_PHOTO_SLUGS.has(slug))continue;
   if(typeof url!=='string'||!/^\.\/hunt-images\/[a-z0-9-]+\.(?:webp|png|jpe?g)$/.test(url))continue;
   const name=huntCharacterFromFilename(slug);
   if(!name||name.length>40)continue; // Matches hunt API character-name limit.
   incoming.push({slug,name,url});
  }
  incoming.sort((a,b)=>a.name.localeCompare(b.name,undefined,{sensitivity:'base'}));
  const changed=JSON.stringify(incoming)!==JSON.stringify(huntUploadedCharacters);
  huntUploadedCharacters=incoming;
  if(changed&&appState.page==='traditions'&&appState.holidayView==='hunt')render();
 }catch(e){
  // No photos uploaded yet, offline, or an older build: the built-in chooser still works.
  if(!huntUploadedCharacters.length&&appState.page==='traditions'&&appState.holidayView==='hunt')render();
 }finally{huntCharactersLoading=false}
}

 modalClose();holidayWrite(plan);showToast(item.done?'Shopping item updated':'Added to your shopping list');
}
function openHolidayEditor(kind,id){const plan=holidayPlan(),task=(plan[kind]||[]).find(t=>t.id===id),isEve=kind==='eve';const html=`<form id="holidayTaskForm" class="cp-modal-form"><input type="hidden" name="kind" value="${kind}"><input type="hidden" name="taskId" value="${escapeHTML(task?.id||'')}"><label>What needs doing?<input name="name" maxlength="100" required autofocus placeholder="e.g. Put cookies out for Santa" value="${escapeHTML(task?.name||'')}"></label>${isEve?`<label>When?<select name="phase"><option value="eve" ${task?.phase!=='morning'?'selected':''}>Christmas Eve</option><option value="morning" ${task?.phase==='morning'?'selected':''}>Christmas morning</option></select></label>`:`<div class="cp-row"><label>Due date (optional)<input name="date" type="date" value="${escapeHTML(task?.date||'')}"></label><label>Who’s handling it?<select name="owner">${['Anyone','Me','Another caregiver'].map(v=>`<option value="${v}" ${v===(task?.owner||'Anyone')?'selected':''}>${v}</option>`).join('')}</select></label></div>`}</form>`;modalOpen(task?'Edit checklist item':'Add to checklist',html,'<button type="button" class="secondary" data-action="close">Cancel</button><button type="submit" class="primary" form="holidayTaskForm">Save</button>');document.querySelector('#holidayTaskForm [name=name]')?.focus();}
function saveHolidayTask(e){e.preventDefault();const form=e.target,values=Object.fromEntries(new FormData(form)),name=String(values.name||'').trim().slice(0,100),kind=values.kind;if(!name||!['todos','eve'].includes(kind))return;const plan=holidayPlan(),items=plan[kind];let task=items.find(x=>x.id===values.taskId);if(task){task.name=name;}else{task={id:makeId(),name,done:false};items.push(task)}if(kind==='eve'){task.phase=values.phase==='morning'?'morning':'eve'}else{task.date=/^\d{4}-\d{2}-\d{2}$/.test(values.date||'')?values.date:'';task.owner=['Me','Another caregiver'].includes(values.owner)?values.owner:'Anyone'}modalClose();holidayWrite(plan);showToast('Checklist updated');}
function holidayAction(action,el){const kind=el.dataset.kind,id=el.dataset.id;
 if(action==='holiday-view'){appState.holidayView=el.dataset.view;render();if(appState.holidayView==='hunt'){void loadUploadedHuntCharacters();void loadHuntHQRounds();}return}
 if(action==='holiday-add'){openHolidayEditor(kind);return}
 if(action==='holiday-edit'){openHolidayEditor(kind,id);return}
 if(action==='holiday-hunt-mode'){appState.huntMode=el.dataset.mode==='mega'?'mega':'standalone';render();return}
 if(action==='holiday-hunt-theme'){appState.huntStandaloneTheme=el.value;return}
 if(action==='holiday-hunt-play-mode'){appState.huntPlayMode=el.value;return}
 if(action==='holiday-hunt-character'){
  const name=el.dataset.character,selected=huntSelectedCharacters().slice();if(!name)return;
  const index=selected.findIndex(x=>huntCharacterSlug(x)===huntCharacterSlug(name));
  if(index>=0)selected.splice(index,1);
  else if(selected.length>=5){showToast('Choose five characters. Remove one before adding another.');return}
  else selected.push(name);
  appState.huntCharacters=selected;render();return;
 }
 if(action==='holiday-hunt-character-custom'){
  const field=document.getElementById('huntCustomCharacter');const name=(field?.value||'').trim().replace(/[<>\x00-\x1f]/g,'').slice(0,40);if(!name){showToast('Enter a character name first.');return}
  const selected=huntSelectedCharacters().slice();if(selected.some(x=>huntCharacterSlug(x)===huntCharacterSlug(name))){showToast('Already selected.');return}
  if(selected.length>=5){showToast('Remove one character before adding another.');return}
  appState.huntCharacters=[...selected,name];render();return;
 }
 if(action==='holiday-hunt-photo-mode'){appState.huntPhotoMode=!!el.checked;render();return;}
 if(action==='holiday-hunt-generate'){
  const mode=appState.huntMode==='mega'?'mega':'standalone',characters=mode==='mega'?huntSelectedCharacters().slice():[];
  if(mode==='mega'&&characters.length!==5){showToast('Choose exactly five characters first.');return}
  const name=String(document.getElementById('huntCollectionTitle')?.value||'').trim().slice(0,65);
  if(!name){showToast('Give your hunt a name first.');document.getElementById('huntCollectionTitle')?.focus();return}
  const theme=document.getElementById('huntStandaloneTheme')?.value||appState.huntStandaloneTheme||'colors',playMode=document.getElementById('huntPlayMode')?.value||appState.huntPlayMode||'competition',photoMode=huntPhotoSelected();
  el.disabled=true;el.textContent='Creating…';
  (async()=>{try{
   const response=await fetch('/api/hunts',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode,title:name,theme,playMode,characters,photoMode})});
   const result=await response.json();if(!response.ok)throw Error(result.error||'Could not start hunt');
   const plan=holidayPlan();const next={id:result.hunt.id,mode,title:name,theme,playMode,characters,photoMode,createdAt:Date.now()};
   plan.hunts=[...allHolidayHunts(plan).reverse().filter(x=>x.id!==next.id),next].slice(-30);plan.hunt=next;
   if(Array.isArray(appState.huntHQList))appState.huntHQList=[next,...appState.huntHQList];
   appState.huntCollectionDraft='';holidayWrite(plan);showToast(name+' created!');void loadHuntHQRounds();
  }catch(err){showToast(err.message||'Could not create hunt');el.disabled=false;el.textContent='Create hunt'}})();return;
 }
 if(['holiday-hunt-rename','holiday-hunt-archive','holiday-hunt-restore','holiday-hunt-delete'].includes(action)){
  const huntId=el.dataset.hunt,hunt=allHolidayHunts(holidayPlan()).find(h=>h.id===huntId);if(!hunt)return;
  const operation=action.split('-').pop();let title=hunt.title;
  if(operation==='rename'){const chosen=prompt('Competition name:',title||'Christmas Lights Hunt');if(chosen===null)return;title=chosen.trim().slice(0,65);if(!title){showToast('Enter a name');return}}
  if(operation==='archive'&&!confirm('Archive '+(hunt.title||'this hunt')+'? It will become read-only, but its pictures and scores stay saved.'))return;
  if(operation==='delete'&&!confirm('Permanently delete "'+(hunt.title||'this hunt')+'"?\n\nAll of its players, scores, linked mini hunts and uploaded hunt photos will be removed for everyone. The invitation link will stop working.\n\nOther hunts and gifts are not affected. This CANNOT be undone.'))return;
  el.disabled=true;
  (async()=>{try{
   const r=await fetch('/api/hunts/'+huntId+'/manage',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:operation,title,confirmHuntId:operation==='delete'?huntId:undefined})});const data=await r.json();if(!r.ok)throw Error(data.error||'Could not update hunt');
   if(operation==='delete'){
    if(Array.isArray(appState.huntHQList))appState.huntHQList=appState.huntHQList.filter(h=>h.id!==huntId);
    delete appState.huntHQSaves[huntId];appState.huntHQBusy.delete(huntId);
    const plan=holidayPlan();plan.hunts=(plan.hunts||[]).filter(h=>h?.id!==huntId);
    if(plan.hunt?.id===huntId)plan.hunt=plan.hunts.at(-1)||null;
    holidayWrite(plan);showToast(data.warning||'Hunt permanently deleted');
   }else{
    if(Array.isArray(appState.huntHQList))appState.huntHQList=appState.huntHQList.map(h=>h.id===huntId?{...h,...(operation==='rename'?{title}:{archived:data.archived})}:h);
    showToast(operation==='rename'?'Hunt renamed':operation==='archive'?'Hunt archived':'Hunt restored');render();
   }
   void loadHuntHQRounds();
  }catch(e){showToast(e.message||'Could not update hunt')}finally{el.disabled=false}})();return;
 }
 if(action==='holiday-hunt-night-create'){
  const huntId=String(el.dataset.hunt||'');const choice=document.querySelector(`select[data-hq-theme="${huntId}"]`);const theme=choice?.value;
  if(!/^[a-f0-9]{32}$/.test(huntId)||!HUNT_NIGHT_CHOICES.some(x=>x[0]===theme))return;
  el.disabled=true;el.textContent='Adding night…';
  (async()=>{try{
   const r=await fetch('/api/hunts/'+huntId+'/nights',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({theme})});
   const data=await r.json();if(!r.ok)throw Error(data.error||'Could not create a themed hunt');
   appState.huntHQSaves[huntId]=[...(appState.huntHQSaves[huntId]||[]),data.night];render();
   showToast(data.night.title+' added! Your friends can find it through the same Mega Hunt link.');
  }catch(e){showToast(e.message||'Could not add themed night');el.disabled=false;el.textContent='+ Add themed hunt'}})();return;
 }
 if(action==='holiday-hunt-copy'||action==='holiday-hunt-open'){const hunt=allHolidayHunts(holidayPlan()).find(h=>h.id===el.dataset.hunt)||holidayPlan().hunt;if(!hunt?.id)return;const link=holidayHuntLink(hunt.id);if(action==='holiday-hunt-open'){window.open(link,'_blank','noopener,noreferrer');return}if(navigator.clipboard?.writeText){navigator.clipboard.writeText(link).then(()=>showToast('Hunt link copied!')).catch(()=>prompt('Copy your hunt link:',link))}else prompt('Copy your hunt link:',link);return}
 if(action==='holiday-reset'){if(!confirm('Uncheck all Christmas Eve and morning items? Your custom checklist will stay.'))return;const plan=holidayPlan();plan.eve.forEach(t=>t.done=false);plan.year=new Date().getFullYear();holidayWrite(plan);showToast('Checklist reset');return}
 if(action==='holiday-add-shop'){openHolidaySupplyEditor(kind,id);return}
 if(action==='holiday-shop-edit'){const plan=holidayPlan(),item=plan.shoppingItems.find(i=>i.id===id);if(item)openHolidaySupplyEditor(item.taskKind,item.taskId,item.id);return}
 if(action==='holiday-shop-toggle'||action==='holiday-shop-delete'){
  const plan=holidayPlan(),item=plan.shoppingItems.find(i=>i.id===id);if(!item)return;
  if(action==='holiday-shop-toggle'){item.done=!item.done;holidayWrite(plan);showToast(item.done?'Marked as picked up':'Returned to shopping list');return}
  if(!confirm('Remove this item from the shopping list? The related to-do will stay.'))return;
  plan.shoppingItems=plan.shoppingItems.filter(i=>i.id!==id);holidayWrite(plan);showToast('Shopping item removed');return;
 }
 if(!['todos','eve'].includes(kind))return;const plan=holidayPlan(),task=plan[kind].find(t=>t.id===id);if(!task)return;
 if(action==='holiday-toggle'){task.done=!task.done;holidayWrite(plan);return}
 if(action==='holiday-delete'){if(!confirm('Remove this checklist item? Any linked shopping items will stay on your shopping list.'))return;plan[kind]=plan[kind].filter(t=>t.id!==id);for(const item of plan.shoppingItems)if(item.taskId===id&&item.taskKind===kind){item.taskId='';item.taskKind='';}holidayWrite(plan);return}
}

boot();
</script>
