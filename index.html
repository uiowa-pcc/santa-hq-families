/* Santa HQ — Heart and star kid icons */

/* Kid 1: purple star */
.kid-card:nth-child(1) .kid-avatar,
.plan-score.one .plan-score-face,
.morning-summary.one .morning-summary-name > span,
.plan-child.one .plan-face,
.morning-colhead.one .face,
.kid-person[data-kid="1"] > span {
  --kid-symbol: "★";
  --kid-color: #7654bd;
  --kid-bg: #efebff;
}

/* Kid 2: pink heart */
.kid-card:nth-child(2) .kid-avatar,
.plan-score.two .plan-score-face,
.morning-summary.two .morning-summary-name > span,
.plan-child.two .plan-face,
.morning-colhead.two .face,
.kid-person[data-kid="2"] > span {
  --kid-symbol: "♥";
  --kid-color: #d56d90;
  --kid-bg: #fce9ef;
}

/* Apply the new icons throughout the app */
:is(
  .kid-avatar,
  .plan-score-face,
  .morning-summary-name > span,
  .plan-child-header .plan-face,
  .morning-colhead .face,
  .kid-person > span
) {
  display: grid;
  place-items: center;
  position: relative;
  background: var(--kid-bg, #fce9ef) !important;
  border-radius: 14px;
}

:is(
  .kid-avatar,
  .plan-score-face,
  .morning-summary-name > span,
  .plan-child-header .plan-face,
  .morning-colhead .face,
  .kid-person > span
) > img {
  display: none !important;
}

:is(
  .kid-avatar,
  .plan-score-face,
  .morning-summary-name > span,
  .plan-child-header .plan-face,
  .morning-colhead .face,
  .kid-person > span
)::after {
  content: var(--kid-symbol);
  color: var(--kid-color);
  font-family: Georgia, serif;
  font-size: 28px;
  line-height: 1;
}

const icons={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M9 21v-8h6v8"/>',gift:'<rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18M12 8c-6 0-6-6-2-6 2 0 2 4 2 6Zm0 0c6 0 6-6 2-6-2 0-2 4-2 6Z"/>',bag:'<path d="M5 8h14l1 13H4L5 8Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/>',check:'<path d="m4 12 5 5L20 6"/>',settings:'<path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/><path d="m19.4 15 .1.1 1.4 1.1-1.6 2.7-1.8-.6a8 8 0 0 1-2 1.2l-.4 1.9h-3.2l-.4-1.9a8 8 0 0 1-2-1.2l-1.8.6-1.6-2.7 1.5-1.2a8 8 0 0 1 0-2.4l-1.5-1.2 1.6-2.7 1.8.6a8 8 0 0 1 2-1.2l.4-1.9h3.2l.4 1.9a8 8 0 0 1 2 1.2l1.8-.6 1.6 2.7-1.5 1.2a8 8 0 0 1 0 2.4Z" transform="translate(-1 -.5) scale(.94)"/>',plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',edit:'<path d="m14 5 5 5M3 21l4.5-1 13-13a2.1 2.1 0 0 0-3-3l-13 13L3 21Z"/>',link:'<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-2 2"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l2-2"/>',close:'<path d="M18 6 6 18M6 6l12 12"/>',trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15M10 10v7m4-7v7"/>',download:'<path d="M12 3v13m-5-5 5 5 5-5M4 17v4h16v-4"/>',upload:'<path d="M12 16V3m-5 5 5-5 5 5M4 15v6h16v-6"/>',star:'<path d="m12 2 3 6.5 7 .9-5.1 4.9 1.3 7L12 18l-6.2 3.3 1.3-7L2 9.4l7-.9L12 2Z"/>',copy:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',shield:'<path d="m12 22 8-4V5l-8-3-8 3v13l8 4Z"/><path d="m9 12 2 2 4-4"/>',external:'<path d="M14 4h6v6M20 4l-9 9"/><path d="M20 14v6H4V4h6"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 10h18c0-3-3-3-3-10M10 21h4"/>'};
const ico=(n)=>`<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${icons[n]||icons.gift}</svg>`;
icons.calendar='<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>';
icons.mail='<rect x="2" y="5" width="20" height="15" rx="3"/><path d="m3 7 9 7 9-7"/>';
icons.users='<circle cx="9" cy="8" r="3"/><path d="M2 20v-2c0-3 3-5 7-5s7 2 7 5v2M17 5a3 3 0 0 1 0 6M22 20v-2c0-2-1-4-4-5"/>';
const navItems=[['dashboard','home','Home'],['gifts','gift','Plan Gifts'],['traditions','calendar','Christmas Plans'],['mailbox','mail','Santa Mail'],['settings','settings','Settings']];

const stages=['Idea','To buy','Bought','Ordered','Arrived','Wrapped'];
const categories=['Big gift','Regular gift','Stocking','Experience','Shared / family'];
const appState={page:'dashboard',gifts:[],search:'',filterKid:'all',filterStatus:'all',filterCat:'all',giftImage:'',editingId:null,online:false,user:null,cloud:null,cloudUnsubs:[],loading:false,metaReceived:false,fromSharedLink:null,messages:[],kidActive:false,kidChoice:'Wish update',kidSelected:'1',kidMode:'talk',morningPrices:false,morningCompact:true,giftView:'ideas',compareIds:[]};
const DEFAULT={familyName:'Our North Pole',child1:'Riley',child2:'Quinn',budget1:250,budget2:250,firebase:null,familyId:'',grownupPin:'',traditions:[],holidayPlans:null};
// Stable numeric IDs retain old gift and Santa mail references; 1–6 children per family.
const CHILD_ICONS={star:{symbol:'★',label:'Star',color:'#7657c5',tint:'#f0eaff'},heart:{symbol:'♥',label:'Heart',color:'#c44f86',tint:'#ffedf3'},flower:{symbol:'✿',label:'Flower',color:'#bb759c',tint:'#faedf6'},moon:{symbol:'☾',label:'Moon',color:'#586ab2',tint:'#eaf0ff'},sparkle:{symbol:'✦',label:'Sparkle',color:'#ad823a',tint:'#fff3d9'},snow:{symbol:'❄',label:'Snowflake',color:'#487baf',tint:'#e9f7ff'}};
const ELF_ICONS={'elf-purple-girl':'Purple girl elf','elf-pink-girl':'Pink girl elf','elf-red-girl':'Red girl elf','elf-lilac-girl':'Lilac girl elf','elf-green-boy':'Green boy elf','elf-blue-boy':'Blue boy elf','elf-teal-boy':'Teal boy elf','elf-navy-boy':'Navy boy elf','elf-gold':'Golden elf','elf-mint':'Mint elf','elf-coral':'Coral elf','elf-classic':'Classic elf'};
const CHILD_ICON_NAMES=[...Object.keys(ELF_ICONS),...Object.keys(CHILD_ICONS)];
function configuredChildren(){
 const raw=Array.isArray(settings.children)&&settings.children.length?settings.children:null;
 if(!raw)return [{id:'1',name:String(settings.child1||'Child 1'),icon:'star',budget:cents(settings.budget1)},{id:'2',name:String(settings.child2||'Child 2'),icon:'heart',budget:cents(settings.budget2)}];
 const ids=new Set();return raw.filter(x=>x&&/^([1-6])$/.test(String(x.id))&&!ids.has(String(x.id))&&ids.add(String(x.id))).slice(0,6).map((c,i)=>({id:String(c.id),name:String(c.name||'Child '+(i+1)).slice(0,50),icon:(CHILD_ICONS[c.icon]||ELF_ICONS[c.icon])?c.icon:CHILD_ICON_NAMES[i%CHILD_ICON_NAMES.length],budget:cents(c.budget),interests:String(c.interests||'').slice(0,350),favorites:String(c.favorites||'').slice(0,350),shareFavorites:c.shareFavorites===true}));
}
function childIds(){return configuredChildren().map(c=>c.id)}
function validRecipient(k){return childIds().includes(String(k))||k==='both'||k==='unassigned'}
function sharedLabel(){return childIds().length===2?'Both kids':'All children'}
function childFor(id){return configuredChildren().find(c=>c.id===String(id))}
function childBudget(id){return childFor(id)?.budget||0}
function iconHTML(icon,className='kid-symbol'){
 if(ELF_ICONS[icon])return `<span class="${className} elf-avatar" data-elf="${icon}" title="${ELF_ICONS[icon]}" role="img" aria-label="${ELF_ICONS[icon]}"></span>`;
 const token=CHILD_ICONS[icon]||CHILD_ICONS.star;
 return `<span class="${className}" title="${token.label}" aria-label="${token.label}" style="--child-accent:${token.color};--child-tint:${token.tint}">${token.symbol}</span>`;
}
function childChoiceIcon(id){return iconHTML(childFor(id)?.icon||'star')}
function childChoiceOptions(field,selected='1',includeUnassigned=true){return [...configuredChildren().map(c=>[c.id,c.name]),['both',sharedLabel()],...(includeUnassigned?[['unassigned','Still deciding']]:[])].map(([k,name])=>quickChoice(field,k,name,selected===k)).join('')}
function syncLegacyChildren(){const cs=configuredChildren();if(Array.isArray(settings.children)&&settings.children.length){settings.child1=cs[0]?.name||'Child 1';settings.child2=cs[1]?.name||'Child 2';settings.budget1=cs[0]?.budget||0;settings.budget2=cs[1]?.budget||0;}}

let settings={...DEFAULT};let db=null,toastTimer;
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeLink(v){try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:''}catch{return ''}}
function safeImage(v){let u=String(v||'');return /^data:image\/(webp|png|jpeg|jpg);base64,/i.test(u)?u:safeLink(u)}
function money(x){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2,minimumFractionDigits:Number(x)%1===0?0:2}).format(Number(x)||0)}
function cents(x){return Math.max(0,Number(x)||0)}
function giftTotal(g){return cents(g.price)*Math.max(1,Number(g.qty)||1)+cents(g.extra)}
function giftPriceLabel(g){return g.price===null||g.price===undefined||g.price===''?'Price TBD':money(giftTotal(g))}
function childShare(g,k){return (g.kid===k?1:g.kid==='both'?1/Math.max(childIds().length,1):0)*giftTotal(g)}
function bought(g){return ['Bought','Ordered','Arrived','Wrapped'].includes(g.status)}
function shoppingStageLabel(status){return status==='To buy'?'On shopping list':(['Bought','Ordered','Arrived','Wrapped'].includes(status)?'Purchased':'Idea')}
function storeNameFromLink(link){try{const h=new URL(safeLink(link)).hostname.replace(/^www\./,'');const names={'amazon.com':'Amazon','target.com':'Target','walmart.com':'Walmart','lego.com':'LEGO','sephora.com':'Sephora','bestbuy.com':'Best Buy','costco.com':'Costco'};return Object.entries(names).find(([k])=>h===k||h.endsWith('.'+k))?.[1]||h}catch{return ''}}
function savedPrice(g){return g.price===null||g.price===undefined||g.price===''?null:cents(g.price)}
function checkedDealPrice(g){return g.dealLatestPrice===null||g.dealLatestPrice===undefined||g.dealLatestPrice===''?null:cents(g.dealLatestPrice)}
function atTarget(g){const price=checkedDealPrice(g);return price!==null&&g.targetPrice!==null&&g.targetPrice!==undefined&&g.targetPrice!==''&&price<=cents(g.targetPrice)}
function dealCheckedLabel(g){if(!g.dealPriceCheckedAt)return 'Not refreshed yet';const d=new Date(g.dealPriceCheckedAt);return Number.isNaN(d.valueOf())?'Last check unknown':'Checked '+d.toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}

function planned(g){return g.status!=='Idea'}
function totals(){let spent=0,plannedCost=0,toShop=0,wrapped=0,ordered=0;for(const g of appState.gifts){const n=giftTotal(g);if(bought(g))spent+=n;if(planned(g))plannedCost+=n;if(g.status==='To buy'||(g.status==='Idea'&&getPlanLane(g)!=='ideas'))toShop++;if(g.status==='Wrapped')wrapped++;if(g.status==='Ordered')ordered++;}return {spent,plannedCost,toShop,wrapped,ordered,total:appState.gifts.length}}
function kidName(v){return childFor(v)?.name||(v==='both'?sharedLabel():'Still deciding')}
function kidEmoji(v){return childChoiceIcon(v)}
function catEmoji(v){const art=({"Big gift":"present","Regular gift":"present","Stocking":"stocking","Experience":"ornament","Shared / family":"tree"})[v]||"present";return `<img src="./art/${art}.svg" alt="" class="category-art" loading="lazy">`}
function statusEmoji(v){return ""}
function makeId(){return (globalThis.crypto?.randomUUID?.()||'g'+Date.now()+Math.random().toString(36).slice(2))}
async function initDB(){return new Promise((resolve,reject)=>{let req=indexedDB.open('santa_hq_family_'+(window.SANTA_FAMILY_ID||'guest'),2);req.onupgradeneeded=()=>{let d=req.result;if(!d.objectStoreNames.contains('gifts'))d.createObjectStore('gifts',{keyPath:'id'});if(!d.objectStoreNames.contains('mail'))d.createObjectStore('mail',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function dbExec(mode,action){return new Promise((resolve,reject)=>{const t=db.transaction('gifts',mode);let req=action(t.objectStore('gifts'));if(req){req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)}else {t.oncomplete=()=>resolve();t.onerror=()=>reject(t.error)}})}
async function readGifts(){return dbExec('readonly',s=>s.getAll())}
async function putGift(g){return dbExec('readwrite',s=>s.put(g))}
async function removeGift(id){return dbExec('readwrite',s=>s.delete(id))}
async function replaceGifts(gs){return new Promise((resolve,reject)=>{const t=db.transaction('gifts','readwrite');let store=t.objectStore('gifts');store.clear();gs.forEach(g=>store.put(g));t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}
function mailDBExec(mode,action){return new Promise((resolve,reject)=>{const t=db.transaction('mail',mode);let req=action(t.objectStore('mail'));if(req){req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)}else{t.oncomplete=()=>resolve();t.onerror=()=>reject(t.error)}})}
async function readLocalMail(){return (await mailDBExec('readonly',s=>s.getAll())).filter(m=>m&&m.id&&m.kid)}
async function replaceMail(mail){return new Promise((resolve,reject)=>{const t=db.transaction('mail','readwrite'),store=t.objectStore('mail');store.clear();mail.forEach(m=>store.put(m));t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}
function saveSettingsLocal(){localStorage.setItem('santa_hq_settings_'+(window.SANTA_FAMILY_ID||'guest'),JSON.stringify(settings))}
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3800)}
function daysToChristmas(date=new Date()){
  const year=date.getFullYear(), month=date.getMonth(), day=date.getDate();
  const nextYear=month===11&&day>25?year+1:year;
  return (Date.UTC(nextYear,11,25)-Date.UTC(year,month,day))/86400000;
}
function renderCountdown(){
  const sleeps=daysToChristmas();
  document.getElementById('countdown').textContent=sleeps===0
    ? 'Merry Christmas!'
    : `${sleeps} ${sleeps===1?'sleep':'sleeps'} until Christmas`;
}
function renderNav(){for(const id of ['desktopNav','mobileNav']){document.getElementById(id).innerHTML=navItems.filter(n=>id!=='mobileNav'||n[0]!=='settings').map(([page,icon,title])=>`<button class="nav-btn ${appState.page===page?'active':''}" data-action="nav" data-page="${page}">${ico(icon)}<span>${title}</span></button>`).join('')}const sync=document.getElementById('sideSync');sync.classList.toggle('online',appState.online);sync.querySelector('span').textContent=appState.online?'Family sync is on':'Saved on this device';const topDot=document.getElementById('topSyncDot');topDot.classList.toggle('online',appState.online);topDot.title=appState.online?'Connected: live family syncing':'Local storage: not yet synced';document.querySelector('.topbar-year').textContent='· '+new Date().getFullYear();renderCountdown()}
function heading(kicker,title,subtitle,action=true){return `<div class="headrow"><div><div class="eyebrow">${kicker}</div><h1 class="heading">${title}</h1>${subtitle?`<p class="sub">${subtitle}</p>`:''}</div>${action?`<button class="primary" data-action="add">${ico('plus')} Add idea</button>`:''}</div>`}
function stat(label,value,note,graphic){const art=({P:'present',L:'stocking',W:'tree',A:'mailbox'})[graphic]||'present';return `<div class="stat-card"><div class="stat-top"><div class="stat-label">${label}</div><span class="stat-icon"><img src="./art/${art}.svg" alt=""></span></div><div class="stat-val">${value}</div><div class="stat-note">${note}</div></div>`}
function kidCard(k){const name=kidName(k),budget=childBudget(k);let gs=appState.gifts.filter(g=>g.kid===k||g.kid==='both'),spent=gs.filter(bought).reduce((s,g)=>s+childShare(g,k),0),plannedAmt=gs.filter(planned).reduce((s,g)=>s+childShare(g,k),0),remaining=budget-spent;let per=budget?Math.round(100*spent/budget):0;return `<div class="kid-card"><div class="kid-head"><div class="kid-avatar">${kidEmoji(k)}</div><div><div class="kid-name">${escapeHTML(name)}</div><div class="kid-count">${gs.length} gift${gs.length===1?'':'s'} planned or saved</div></div></div><div class="kid-price"><div><small>Purchased so far</small><br><strong>${money(spent)}</strong></div><div style="text-align:right"><small>Budget</small><br><strong>${money(budget)}</strong></div></div><div class="progress"><div class="bar" style="width:${Math.min(per,100)}%"></div></div><div class="kid-foot"><span>${per}% of budget spent</span><span>${remaining<0?`${money(-remaining)} over budget`:`${money(remaining)} left`}</span></div><div class="helper" style="margin-top:9px">${money(plannedAmt)} in planned + purchased gifts</div></div>`}
function progressView(){
 const all=appState.gifts.length;
 const count=status=>appState.gifts.filter(g=>g.status===status).length;
 const list=[
   ['Ideas saved',count('Idea'),'letter'],
   ['Still to buy',count('To buy'),'present'],
   ['Ordered / on the way',count('Ordered'),'mailbox'],
   ['Bought / ready to wrap',count('Bought')+count('Arrived'),'stocking'],
   ['All wrapped',count('Wrapped'),'tree']
 ];
 return `<div class="steps">${list.map(([label,n,art])=>`<div class="step"><span class="step-icon"><img src="./art/${art}.svg" alt=""></span><div class="step-main"><div class="step-top"><span class="step-title">${label}</span><span class="step-number">${n} gifts</span></div><div class="step-track"><span style="width:${all?100*n/all:0}%"></span></div></div></div>`).join('')}</div>`;
}
function giftCard(g){const img=safeImage(g.image);return `<article class="gift-card"><div class="gift-image">${img?`<img loading="lazy" src="${escapeHTML(img)}" alt="${escapeHTML(g.name)}" onerror="this.replaceWith(document.createTextNode(''))">`:`<div class="placeholder-gift">${catEmoji(g.category)}</div>`}<span class="badge">${escapeHTML(kidName(g.kid))}</span></div><div class="gift-body"><div class="gift-name">${escapeHTML(g.name)}</div><div class="gift-meta"><span>${catEmoji(g.category)} ${escapeHTML(g.category)}</span><span>${escapeHTML(g.store||'')}</span></div><div class="gift-bottom"><div><div class="gift-price">${giftPriceLabel(g)}</div><span class="status-pill ${g.status.toLowerCase()}">${statusEmoji(g.status)} ${escapeHTML(g.status)}</span></div><div class="gift-actions">${g.link&&safeLink(g.link)?`<button class="icon-btn" title="Open product page" aria-label="Open product page" data-action="open-link" data-id="${g.id}">${ico('link')}</button>`:''}<button class="icon-btn" aria-label="Edit ${escapeHTML(g.name)}" title="Edit gift" data-action="edit" data-id="${g.id}">${ico('edit')}</button></div></div></div></article>`}
function emptyGifts(head='Your workshop is waiting!',body='Add your first gift idea, paste a shopping link, or upload a photo to get started.'){return `<div class="empty"><span class="empty-emoji"><img src="./art/tree.svg" alt=""></span><h3>${head}</h3><p>${body}</p><button class="primary" data-action="add">${ico('plus')} Add your first gift</button></div>`}
function dashboard(){
 const t=totals(),unread=appState.messages.filter(m=>!m.read).length;
 const traditions=Array.isArray(settings.traditions)?settings.traditions:[];
 const planned=traditions.filter(x=>x.date&&!x.done).length;
 const upcoming=traditions.filter(x=>x.date&&!x.done&&x.date>=new Date().toISOString().slice(0,10)).sort((a,b)=>String(a.date).localeCompare(String(b.date)))[0];
 const shop=appState.gifts.filter(g=>g.status==='To buy').length;
 const hol=holidayPlan(),supplies=(hol.shoppingItems||[]).filter(x=>!x.done).length;
 const purchased=appState.gifts.filter(bought).length;
 const sleeps=daysToChristmas();
 const art=name=>`<img src="./art/${name}.svg" alt="" loading="lazy">`;
 const destination=(page,title,details,artName,tint,action='nav')=>`<button type="button" class="hq-destination ${tint}" data-action="${action}" ${action==='nav'?`data-page="${page}"`:''}>${art(artName)}<span class="hq-label"><strong>${title}</strong><small>${details}</small></span><span class="hq-chevron" aria-hidden="true">›</span></button>`;
 const status=(action,view,title,detail,artName)=>`<button type="button" class="hq-status" data-action="${action}" ${action==='home-open-plan'?`data-view="${view}"`:''}>${art(artName)}<span><strong>${title}</strong><small>${detail}</small></span></button>`;
 return `<div class="gp-home-clean hq-home">
  <section class="hq-hero" aria-label="Welcome to Santa HQ"><div class="hero-copy"><span class="hq-hello">YOUR LITTLE NORTH POLE</span><h1 class="hq-home-title"><span>Christmas magic,</span><span>all in one place.</span></h1><span class="hq-sleeps">${ico('calendar')} ${sleeps===0?'Merry Christmas!':`${sleeps} ${sleeps===1?'sleep':'sleeps'} until Christmas`}</span></div><span class="hq-hero-spark" aria-hidden="true">✦</span><span class="hq-hero-spark two" aria-hidden="true">✧</span><img class="hq-santa-figure" src="./santa-home.webp" alt="" aria-hidden="true"></section>
  <div class="hq-home-intro"><div><h2>What would you like to do?</h2><p>Everything for a little more Christmas magic.</p></div></div>
  <div class="hq-quick-grid">
   ${destination('gifts','Plan Gifts','Ideas, stockings and presents','present','pink')}
   ${destination('traditions','Christmas Plans','To-dos, shopping and traditions','tree','mint')}
   ${destination('mailbox','Santa Mail','The North Pole inbox','letter','lavender')}
   ${destination('','Lights Hunt','Spot Christmas lights together','ornament','cream','go-lights-hunt')}
  </div>
  <div class="hq-status-grid" aria-label="Christmas progress and shortcuts">
   ${status('home-open-plan','shopping','Shopping List',`${shop+supplies} to pick up`,'crayons')}
   ${status('home-open-plan','traditions','Traditions',`${planned} planned`,'ornament')}
   ${status('nav','','In Santa’s Bag',`${purchased} purchased`,'stocking') .replace('data-action="nav"','data-action="home-open-gifts"')}
  </div>
  <div class="hq-home-bottom">
   ${upcoming?`<div class="hq-home-next"><span aria-hidden="true">✦</span><span><strong>Up next:</strong> ${escapeHTML(upcoming.name)} · ${escapeHTML(traditionDateLabel(upcoming.date))}</span><button type="button" class="plain-btn" data-action="home-open-plan" data-view="traditions">See date</button></div>`:''}
   ${unread?`<div class="hq-home-next"><span aria-hidden="true">✉</span><span>${unread} new Santa ${unread===1?'message':'messages'}</span><button type="button" class="plain-btn" data-action="nav" data-page="mailbox">Read</button></div>`:''}
  </div>
  <details class="hq-budget-details"><summary>Family gift budgets <span>${money(t.spent)} purchased</span></summary><div class="kid-grid">${childIds().map(kidCard).join('')}</div><button class="plain-btn" type="button" data-action="nav" data-page="settings" style="margin:0 0 14px">Edit budgets</button></details>
 </div>`;
}
function filteredGifts(){return [...appState.gifts].filter(g=>(appState.filterKid==='all'||g.kid===appState.filterKid||(appState.filterKid!=='both'&&g.kid==='both'))&&(appState.filterStatus==='all'||g.status===appState.filterStatus)&&(appState.filterCat==='all'||g.category===appState.filterCat)&&(!appState.search||[g.name,g.store,g.notes,g.category,g.link].join(' ').toLowerCase().includes(appState.search.toLowerCase()))).sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')))}

// Gift sorting studio: planning decisions are distinct from purchased/arrived/wrapped progress.
function planLanes(){return ['ideas',...childIds().flatMap(k=>[k+'-stocking',k+'-gifts']),'shared']}
const PLAN_LANE_LABELS=()=>Object.fromEntries([['ideas','Just ideas'],...configuredChildren().flatMap(c=>[[c.id+'-stocking',c.name+' · Stocking'],[c.id+'-gifts',c.name+' · Under the tree']]),['shared','Shared / family']]);
function suggestPlanLane(g){if(g.status==='Idea')return 'ideas';if(g.kid==='both')return 'shared';if(childIds().includes(g.kid))return `${g.kid}-${g.category==='Stocking'?'stocking':'gifts'}`;return 'ideas'}
function giftPlacement(g){
 if(['stocking','tree','undecided'].includes(g?.giftPlacement))return g.giftPlacement;
 if(g?.category==='Stocking'||String(g?.planLane||'').endsWith('-stocking'))return 'stocking';
 if(g?.planLane==='ideas'&&g?.kid==='unassigned')return 'undecided';
 return 'tree';
}
function placementLane(g,place=giftPlacement(g)){
 if(place==='undecided'||!childIds().includes(String(g.kid))&&g.kid!=='both')return 'ideas';
 if(g.kid==='both')return 'shared';
 return g.kid+'-'+(place==='stocking'?'stocking':'gifts');
}
function getPlanLane(g){return placementLane(g);}
function sortedPlanGifts(lane){return appState.gifts.filter(g=>getPlanLane(g)===lane).sort((a,b)=>(Number(a.planOrder)||Number.MAX_SAFE_INTEGER)-(Number(b.planOrder)||Number.MAX_SAFE_INTEGER)||String(a.createdAt||'').localeCompare(String(b.createdAt||''))||String(a.id).localeCompare(String(b.id)))}
function planStats(k){const direct=appState.gifts.filter(g=>getPlanLane(g)===k+'-stocking'||getPlanLane(g)===k+'-gifts'),shared=sortedPlanGifts('shared');let base=direct.reduce((s,g)=>s+giftTotal(g),0),sharedAmt=shared.reduce((s,g)=>s+giftTotal(g),0)/Math.max(childIds().length,1);return{total:base+sharedAmt,stocking:direct.filter(g=>getPlanLane(g)===k+'-stocking').length,main:direct.filter(g=>getPlanLane(g)===k+'-gifts').length,big:direct.filter(g=>g.category==='Big gift').length,shared:shared.length,bought:direct.filter(bought).reduce((s,g)=>s+giftTotal(g),0)+shared.filter(bought).reduce((s,g)=>s+giftTotal(g),0)/Math.max(childIds().length,1)}}
function planScore(k){const n=planStats(k),budget=childBudget(k),name=kidName(k);return `<div class="plan-score ${k==='1'?'one':'two'}"><div class="plan-score-head"><span class="plan-score-face">${kidEmoji(k)}</span><div><strong>${escapeHTML(name)}</strong><small>Estimated planned value</small></div></div><div class="plan-score-price">${money(n.total)}</div><div class="plan-score-sub">${money(budget-n.total)} ${budget>=n.total?'left in budget':'over budget'} · ${money(n.bought)} purchased</div><div class="plan-score-metrics"><span><b>${n.stocking}</b>stocking</span><span><b>${n.main}</b>main gifts</span><span><b>${n.big}</b>big gifts</span></div></div>`}
function planInsight(){const a=planStats('1'),b=planStats('2');let hints=[];if(!a.stocking||!b.stocking)hints.push((!a.stocking&&!b.stocking?'Both stockings need ideas':!a.stocking?settings.child1+' needs stocking ideas':settings.child2+' needs stocking ideas')+' Stocking');else if(a.stocking!==b.stocking)hints.push('Stocking count differs by '+Math.abs(a.stocking-b.stocking));if(!a.main||!b.main)hints.push('One or both under-the-tree lists need ideas');else if(a.main!==b.main)hints.push('Main gift count differs by '+Math.abs(a.main-b.main));if(a.big!==b.big)hints.push('Big gifts: '+a.big+' vs '+b.big);const diff=Math.abs(a.total-b.total);if(diff>=20)hints.push('Estimated value differs by '+money(diff));if(hints.length){return `<div class="plan-insight difference"><span></span><div><strong>Things to compare</strong><p>${hints.map(escapeHTML).join(' · ')}. Even doesn’t have to mean identical—use this as a gut check.</p></div></div>`}return '<div class="plan-insight"><span></span><div><strong>Looking fairly balanced!</strong><p>Stockings, main gifts, and big gift counts look close. You can still adjust for what each child will enjoy.</p></div></div>'}

async function quickLookupLink(){
 const raw=document.getElementById('recipientQuickLink')?.value||'';
 const url=safeLink(raw),status=document.getElementById('recipientQuickLinkStatus');
 if(!url){if(status)status.textContent='Paste a valid https:// store link.';return;}
 const button=document.querySelector('[data-action="quick-lookup"]');if(button)button.disabled=true;
 if(status)status.textContent='Finding available product details…';
 try{
  const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),10000);
  let response;
  try{response=await fetch('https://api.microlink.io?url='+encodeURIComponent(url),{signal:controller.signal});}
  finally{clearTimeout(timeout)}
  const data=await response.json();
  if(!response.ok||data.status!=='success'||!data.data)throw new Error('No product details');
  const title=String(data.data.title||'').split(' | ')[0].trim().slice(0,160);
  const name=document.getElementById('recipientQuickName');if(name&&!name.value.trim()&&title)name.value=title;
  quickImportImage=safeLink(data.data.image?.url)||'';
  if(status)status.textContent='Name/picture imported where available. Enter the price yourself; it is not a live price.';
 }catch(err){if(status)status.textContent='The store blocked automatic details. Your link can still be saved; enter a gift name.';}
 finally{if(button)button.disabled=false;}
}

async function moveToPlan(id,lane,beforeId=null){

 let draft={...original,updatedAt:now};
 if(lane==='shared')draft.kid='both';
 else if(lane!=='ideas')draft.kid=lane.split('-')[0];
 draft=applyPlacement(draft,place);
 let members=sortedPlanGifts(lane).filter(g=>g.id!==id);let at=beforeId?members.findIndex(g=>g.id===beforeId):-1;
 if(at<0)at=members.length;members.splice(at,0,draft);
 const changed=[];
 for(const [i,item] of members.entries()){
   const previous=appState.gifts.find(g=>g.id===item.id),next={...item,planOrder:(i+1)*100};
   if(!previous||JSON.stringify(previous)!==JSON.stringify(next)){next.updatedAt=now;changed.push(next)}
 }
 if(oldLane!==lane){sortedPlanGifts(oldLane).filter(g=>g.id!==id).forEach((g,i)=>{if(g.planOrder!==(i+1)*100)changed.push({...g,planOrder:(i+1)*100,updatedAt:now})})}
 const versions=new Map(changed.map(g=>[g.id,g]));
 try{await Promise.all(changed.map(putGift));appState.gifts=appState.gifts.map(g=>versions.get(g.id)||g);render();showToast('Gift moved; purchase status kept');await Promise.all(changed.map(cloudPutGift));}
 catch(err){console.error(err);showToast('Could not save this move.');}
}

async function smallKidPhoto(file){

  const tempURL=URL.createObjectURL(file);
  try{bitmap=await new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=()=>reject(Error('This photo could not be opened. Choose a JPEG or PNG instead.'));image.src=tempURL})}

 const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));

function traditionAction(action,id,el){
  const items=settings.traditions||[];
  if(action==='tradition-new'){openTradition();return;}
  if(action==='tradition-month'){const [y,m]=traditionMonth().split('-').map(Number);const d=new Date(y,m-1+Number(el?.dataset.offset||0),1);appState.traditionMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;render();return;}
  if(action==='tradition-today'){appState.traditionMonth=null;render();return;}
  if(action==='tradition-unpick'){appState.traditionSelectedId=null;render();return;}
  if(action==='tradition-day'){
    const date=el?.dataset.date;
    if(!date)return;
    if(appState.traditionSelectedId){traditionSchedule(appState.traditionSelectedId,date);}else openTradition({},'',date);
    return;
  }
  if(action==='tradition-example'){
    const name=traditionExamples[Number(id)];if(!name)return;
    if(items.some(t=>t.name.toLowerCase()===name.toLowerCase())){showToast('That idea is already on your list.');return;}
    updateTraditions([...items,{id:makeId(),name,priority:1,date:'',time:'',notes:'',done:false}]);showToast('Added to your wish list');return;
  }
  const item=items.find(t=>t.id===id);if(!item)return;
  if(action==='tradition-pick'){appState.traditionSelectedId=appState.traditionSelectedId===id?null:id;render();return;}
  if(action==='tradition-priority'){updateTraditions(items.map(t=>t.id===id?{...t,priority:(Number(t.priority??1)+1)%3}:t));return;}
  if(action==='tradition-unschedule'){traditionSchedule(id,'');return;}
  if(action==='tradition-edit'){openTradition(item);return;}
  if(action==='tradition-toggle'){updateTraditions(items.map(t=>t.id===id?{...t,done:!t.done}:t));return;}
  if(action==='tradition-delete'&&confirm(`Delete “${item.name}”?`)){appState.traditionSelectedId=null;updateTraditions(items.filter(t=>t.id!==id));}
}

async function refreshGiftPrice(id,{quiet=false}={}){
 const g=appState.gifts.find(item=>item.id===id);
 if(!g||!g.watchDeal||bought(g))return {ok:false,reason:'This gift is not on Deal Watch.'};
 if(!safeLink(g.link))return {ok:false,reason:'Add a direct product link to this gift first.'};
 try{
  if(window.SantaFamilies?.queueCount?.()>0){await window.SantaFamilies.refresh();if(window.SantaFamilies.queueCount()>0)throw Error('This gift is still syncing. Try Refresh again shortly.');}
  const response=await fetch('/api/private/price-check',{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({giftId:g.id})});
  let payload={};try{payload=await response.json()}catch{}
  if(!response.ok)throw Error(payload.error||'This store price could not be checked.');
  if(!Number.isFinite(Number(payload.price))||Number(payload.price)<=0)throw Error('The retailer did not return a usable price.');
  // Keep the gift's original entered/budget price untouched.
  const update={...g,dealLatestPrice:Number(payload.price),dealPriceCheckedAt:payload.checkedAt||new Date().toISOString(),dealPriceSource:String(payload.source||'Retailer API').slice(0,100),updatedAt:new Date().toISOString()};
  await putGift(update);appState.gifts=appState.gifts.map(item=>item.id===id?update:item);await cloudPutGift(update);
  if(!quiet)showToast(`Checked price: ${money(update.dealLatestPrice)} · ${update.dealPriceSource}`);
  return {ok:true};
 }catch(err){if(!quiet)showToast(err.message||'Could not refresh price. Open store to check.');return {ok:false,reason:err.message||'Price unavailable'};}
}

}

 <div class="cp-shopping-stats"><div><span>Still to buy</span><strong>${toBuy.length+toPickUp.length}</strong><small>${toBuy.length} gifts · ${toPickUp.length} holiday items</small></div><div><span>Picked up / purchased</span><strong>${purchased.length+pickedUp.length}</strong><small>${purchased.length} gifts · ${pickedUp.length} holiday items</small></div></div>
 <section class="cp-panel"><div class="cp-top"><div><h2>For your holiday plans <span class="cp-count">${toPickUp.length}</span></h2><p>Need a gingerbread kit, batteries, or cocoa? Add it directly from the related to-do. Buying the item never checks off the activity.</p></div><button type="button" class="secondary" data-action="holiday-view" data-view="overview">Go to to-dos →</button></div>${toPickUp.length?`<div class="cp-shop-items">${toPickUp.map(item=>holidaySupplyRow(item,plan)).join('')}</div>`:'<p class="cp-empty">No holiday supplies to pick up. Use “+ Add shopping item” under any to-do.</p>'}</section>
 <section class="cp-panel"><div class="cp-top"><div><h2>Gifts to buy <span class="cp-count">${toBuy.length}</span></h2><p>Tap “Add to shopping list” in Gift Ideas, then check it off when purchased. Estimated gift cost: ${money(total)}.</p></div><button type="button" class="secondary" data-action="nav" data-page="gifts">Gift Ideas →</button></div>${toBuy.length?`<div class="cp-shop-items">${toBuy.map(g=>row(g,false)).join('')}</div>`:'<p class="cp-empty">No gifts waiting to buy.</p>'}</section>
 ${dealWatchSection()}
 <section class="cp-panel cp-purchased"><div class="cp-top"><div><h2>Purchased <span class="cp-count">${purchased.length+pickedUp.length}</span></h2><p>Everything checked off stays here, including gifts and supplies. Uncheck to return it to shopping. Gift spending: ${money(spent)}.</p></div></div>${pickedUp.length?`<h3 class="cp-purchased-subtitle">Holiday items</h3><div class="cp-shop-items">${pickedUp.map(i=>holidaySupplyRow(i,plan)).join('')}</div>`:''}${purchased.length?`<h3 class="cp-purchased-subtitle">Gifts</h3><div class="cp-shop-items">${purchased.map(g=>row(g,true)).join('')}</div>`:''}${!pickedUp.length&&!purchased.length?'<p class="cp-empty">Purchased gifts and picked-up supplies will appear here.</p>':''}</section></div>`;
}
function holidayOverviewPage(){
 const plan=holidayPlan(),todoDone=plan.todos.filter(t=>t.done).length,eveDone=plan.eve.filter(t=>t.done).length;
 const waiting=appState.gifts.filter(g=>g.status==='To buy').length,purchased=appState.gifts.filter(bought).length,suppliesWaiting=(plan.shoppingItems||[]).filter(i=>!i.done).length;
 return `<div class="cp-page cp-dashboard">${heading('YOUR NORTH POLE COMMAND CENTER','Christmas Plans','The important things in one calm place—checklists, shopping, and the Christmas countdown.',false)}
 <div class="cp-dash-stats"><button type="button" data-action="holiday-view" data-view="shopping"><span>Shopping</span><strong>${waiting+suppliesWaiting} to buy</strong><small>${waiting} gifts · ${suppliesWaiting} holiday items →</small></button><div><span>Holiday to-dos</span><strong>${todoDone}/${plan.todos.length}</strong><small>checked off</small></div><div><span>Christmas prep</span><strong>${eveDone}/${plan.eve.length}</strong><small>completed</small></div></div>
 <div class="cp-dash-toolbar"><button type="button" class="secondary" data-action="holiday-view" data-view="shopping">Shopping list →</button><button type="button" class="secondary" data-action="holiday-view" data-view="traditions">Traditions calendar →</button></div>
 <section class="cp-game-highlight" aria-label="Christmas Lights Scavenger Hunt"><div class="cp-game-icon" aria-hidden="true">✦</div><div class="cp-game-copy"><span class="eyebrow">PLAY TOGETHER</span><h2>Christmas Lights Scavenger Hunt</h2><p>Photo clues, holiday characters and a family scoreboard. Share a link—no guest accounts.</p></div><button type="button" class="secondary" data-action="holiday-view" data-view="hunt">Open lights hunt →</button></section>
 <section class="cp-panel"><div class="cp-top"><div><span class="eyebrow">EVERYDAY HOLIDAY DETAILS</span><h2>Holiday to-dos</h2><p>Cards, school parties, errands—everything beyond gifts.</p></div><button type="button" class="primary" data-action="holiday-add" data-kind="todos">+ Add task</button></div>${holidayListHTML(plan.todos,'todos')}</section>
 <section class="cp-panel"><div class="cp-top"><div><span class="eyebrow">SANTA'S FINAL CHECKLIST</span><h2>Christmas Eve & morning</h2><p>${plan.eve.length-eveDone} things left · Both caregivers can check these off.</p></div><button type="button" class="secondary" data-action="holiday-add" data-kind="eve">+ Add step</button></div><div class="cp-progress-head"><span>Christmas prep</span><strong>${eveDone}/${plan.eve.length} done</strong></div><div class="cp-track"><span style="width:${plan.eve.length?eveDone/plan.eve.length*100:0}%"></span></div><div class="cp-grid"><div><h3>Christmas Eve</h3>${holidayListHTML(plan.eve.filter(t=>t.phase!=='morning'),'eve')}</div><div><h3>Christmas morning</h3>${holidayListHTML(plan.eve.filter(t=>t.phase==='morning'),'eve')}</div></div><button type="button" class="plain-btn" data-action="holiday-reset">Reset checklist for next Christmas</button></section></div>`;
}
function holidayHuntLink(id){return new URL('hunt.html',document.baseURI).href.split('#')[0]+'#room='+encodeURIComponent(id)}
function holidayHuntPage(){
 const plan=holidayPlan(),hunt=plan.hunt,mode=appState.huntMode||hunt?.mode||'easy',link=hunt?.id?holidayHuntLink(hunt.id):'';
 return `<div class="cp-page">${heading('PLAY TOGETHER','Christmas lights hunt','Photo clues, Christmas characters, and a live family leaderboard—no guest account needed.',false)}
 <div class="cp-hunt-hero"><span class="eyebrow">PHOTO SCAVENGER HUNT</span><h2>Spot the magic. See who's ahead.</h2><p>Look for glowing decorations and holiday characters in the neighborhood. Every family member gets the same photo clue board, checks off finds, and appears on the live scoreboard.</p></div>
 <section class="cp-panel"><div class="cp-top"><div><h2>Create a family hunt</h2><p>Share one link by text. Guests choose a nickname—no signup.</p></div></div>
 <div class="cp-choice"><button type="button" data-action="holiday-hunt-mode" data-mode="easy" aria-pressed="${mode==='easy'}">Little lights hunt<small>9 picture clues · gentle challenge</small></button><button type="button" data-action="holiday-hunt-mode" data-mode="family" aria-pressed="${mode==='family'}">Family challenge<small>16 picture clues · characters & decorations</small></button></div>
 <div class="cp-hunt-actions"><button type="button" class="primary" data-action="holiday-hunt-generate">${hunt?.id?'Start a new hunt':'Create a hunt'}</button></div>
 ${hunt?.id?`<div class="cp-hunt-ready"><strong>Family hunt ready!</strong><p>Send this to the people playing. Everyone's progress updates on the scoreboard.</p><div class="cp-hunt-actions"><button type="button" class="primary" data-action="holiday-hunt-copy">Copy invite link</button><button type="button" class="secondary" data-action="holiday-hunt-open">Open hunt & leaderboard ↗</button></div></div>`:''}
 <p class="cp-small-note">Only guest nicknames and scores are visible to others with the hunt link; gifts and family settings stay private. Finds are on the honor system. Your hunt link expires after 30 days.</p></section></div>`;
}
const christmasTraditionsBase=traditionsPage;
traditionsPage=function(){const current=['overview','traditions','shopping','hunt'].includes(appState.holidayView)?appState.holidayView:'overview';return `<div class="cp-switch" role="group" aria-label="Christmas Plans sections">${HOLIDAY_VIEWS.map(([id,name])=>`<button type="button" data-action="holiday-view" data-view="${id}" aria-pressed="${current===id}">${escapeHTML(name)}</button>`).join('')}</div>`+(current==='overview'?holidayOverviewPage():current==='shopping'?holidayShoppingPage():current==='hunt'?holidayHuntPage():christmasTraditionsBase());};
function openHolidaySupplyEditor(kind,taskId,itemId){
 const plan=holidayPlan(),item=(plan.shoppingItems||[]).find(i=>i.id===itemId),task=(plan[kind]||[]).find(t=>t.id===taskId);
 if(!item&&!task){showToast('This to-do is no longer available.');return}
 const label=task?.name||holidaySupplySource(item,plan);
 const html=`<form id="holidaySupplyForm" class="cp-modal-form"><input type="hidden" name="itemId" value="${escapeHTML(item?.id||'')}"><input type="hidden" name="taskId" value="${escapeHTML(item?.taskId||taskId||'')}"><input type="hidden" name="taskKind" value="${escapeHTML(item?.taskKind||kind||'todos')}"><p class="cp-modal-context">For: <strong>${escapeHTML(label)}</strong></p><label>What do you need to buy?<input name="name" maxlength="100" required placeholder="e.g. Gingerbread house kit" value="${escapeHTML(item?.name||'')}"></label><p class="cp-small-note">This creates a separate shopping item. The to-do stays on your checklist until you finish the activity.</p></form>`;
 modalOpen(item?'Edit shopping item':'Add shopping item',html,'<button type="button" class="secondary" data-action="close">Cancel</button><button type="submit" class="primary" form="holidaySupplyForm">'+(item?'Save changes':'Add to shopping list')+'</button>');
 document.querySelector('#holidaySupplyForm [name=name]')?.focus();
}
function saveHolidaySupply(e){
 e.preventDefault();const values=Object.fromEntries(new FormData(e.target)),name=String(values.name||'').trim().slice(0,100);
 if(!name){showToast('Enter what you need to buy.');return}
 const plan=holidayPlan();let item=plan.shoppingItems.find(x=>x.id===values.itemId);
 if(item){item.name=name;}else{
  const kind=values.taskKind,taskId=values.taskId;
  if(!['todos','eve'].includes(kind)||!(plan[kind]||[]).some(t=>t.id===taskId)){showToast('The linked to-do was not found.');return}
  item={id:makeId(),name,taskId,taskKind:kind,done:false,createdAt:new Date().toISOString()};plan.shoppingItems.push(item);
 }
 modalClose();holidayWrite(plan);showToast(item.done?'Shopping item updated':'Added to your shopping list');
}
function openHolidayEditor(kind,id){const plan=holidayPlan(),task=(plan[kind]||[]).find(t=>t.id===id),isEve=kind==='eve';const html=`<form id="holidayTaskForm" class="cp-modal-form"><input type="hidden" name="kind" value="${kind}"><input type="hidden" name="taskId" value="${escapeHTML(task?.id||'')}"><label>What needs doing?<input name="name" maxlength="100" required autofocus placeholder="e.g. Put cookies out for Santa" value="${escapeHTML(task?.name||'')}"></label>${isEve?`<label>When?<select name="phase"><option value="eve" ${task?.phase!=='morning'?'selected':''}>Christmas Eve</option><option value="morning" ${task?.phase==='morning'?'selected':''}>Christmas morning</option></select></label>`:`<div class="cp-row"><label>Due date (optional)<input name="date" type="date" value="${escapeHTML(task?.date||'')}"></label><label>Who’s handling it?<select name="owner">${['Anyone','Me','Another caregiver'].map(v=>`<option value="${v}" ${v===(task?.owner||'Anyone')?'selected':''}>${v}</option>`).join('')}</select></label></div>`}</form>`;modalOpen(task?'Edit checklist item':'Add to checklist',html,'<button type="button" class="secondary" data-action="close">Cancel</button><button type="submit" class="primary" form="holidayTaskForm">Save</button>');document.querySelector('#holidayTaskForm [name=name]')?.focus();}
function saveHolidayTask(e){e.preventDefault();const form=e.target,values=Object.fromEntries(new FormData(form)),name=String(values.name||'').trim().slice(0,100),kind=values.kind;if(!name||!['todos','eve'].includes(kind))return;const plan=holidayPlan(),items=plan[kind];let task=items.find(x=>x.id===values.taskId);if(task){task.name=name;}else{task={id:makeId(),name,done:false};items.push(task)}if(kind==='eve'){task.phase=values.phase==='morning'?'morning':'eve'}else{task.date=/^\d{4}-\d{2}-\d{2}$/.test(values.date||'')?values.date:'';task.owner=['Me','Another caregiver'].includes(values.owner)?values.owner:'Anyone'}modalClose();holidayWrite(plan);showToast('Checklist updated');}
function holidayAction(action,el){const kind=el.dataset.kind,id=el.dataset.id;
 if(action==='holiday-view'){appState.holidayView=el.dataset.view;render();return}
 if(action==='holiday-add'){openHolidayEditor(kind);return}
 if(action==='holiday-edit'){openHolidayEditor(kind,id);return}
 if(action==='holiday-hunt-mode'){appState.huntMode=el.dataset.mode==='family'?'family':'easy';render();return}
 if(action==='holiday-hunt-generate'){
  const mode=(appState.huntMode||holidayPlan().hunt?.mode)==='family'?'family':'easy';
  (async()=>{try{const response=await fetch('/api/hunts',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode})});const result=await response.json();if(!response.ok)throw Error(result.error||'Could not start hunt');const plan=holidayPlan();plan.hunt={id:result.hunt.id,mode,createdAt:new Date().toISOString()};holidayWrite(plan);showToast('Family hunt created—share the invite link!')}catch(err){console.error(err);showToast(err.message||'Could not create hunt. Try again online.')}})();return;}
 if(action==='holiday-hunt-copy'||action==='holiday-hunt-open'){const hunt=holidayPlan().hunt;if(!hunt?.id)return;const link=holidayHuntLink(hunt.id);if(action==='holiday-hunt-open'){window.open(link,'_blank','noopener,noreferrer');return}if(navigator.clipboard?.writeText){navigator.clipboard.writeText(link).then(()=>showToast('Hunt link copied!')).catch(()=>prompt('Copy your hunt link:',link))}else prompt('Copy your hunt link:',link);return}
 if(action==='holiday-reset'){if(!confirm('Uncheck all Christmas Eve and morning items? Your custom checklist will stay.'))return;const plan=holidayPlan();plan.eve.forEach(t=>t.done=false);plan.year=new Date().getFullYear();holidayWrite(plan);showToast('Checklist reset');return}
 if(action==='holiday-add-shop'){openHolidaySupplyEditor(kind,id);return}
 if(action==='holiday-shop-edit'){const plan=holidayPlan(),item=plan.shoppingItems.find(i=>i.id===id);if(item)openHolidaySupplyEditor(item.taskKind,item.taskId,item.id);return}
 if(action==='holiday-shop-toggle'||action==='holiday-shop-delete'){
  const plan=holidayPlan(),item=plan.shoppingItems.find(i=>i.id===id);if(!item)return;
  if(action==='holiday-shop-toggle'){item.done=!item.done;holidayWrite(plan);showToast(item.done?'Marked as picked up':'Returned to shopping list');return}
  if(!confirm('Remove this item from the shopping list? The related to-do will stay.'))return;
  plan.shoppingItems=plan.shoppingItems.filter(i=>i.id!==id);holidayWrite(plan);showToast('Shopping item removed');return;
 }
 if(!['todos','eve'].includes(kind))return;const plan=holidayPlan(),task=plan[kind].find(t=>t.id===id);if(!task)return;
 if(action==='holiday-toggle'){task.done=!task.done;holidayWrite(plan);return}
 if(action==='holiday-delete'){if(!confirm('Remove this checklist item? Any linked shopping items will stay on your shopping list.'))return;plan[kind]=plan[kind].filter(t=>t.id!==id);for(const item of plan.shoppingItems)if(item.taskId===id&&item.taskKind===kind){item.taskId='';item.taskKind='';}holidayWrite(plan);return}
}

boot();
</script>
<script src="./family-sync.js"></script>
<script src="./family-hq.js"></script>
</body>
</html>
