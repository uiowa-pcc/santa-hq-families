  };

 else if(n.includes('inflatable')){s=el(50,55,27,29,'#fdf0e7')+c(50,32,13,'#f4a588')+p('M25 54q23-15 50 0','none',R,6)+p('M45 70v14M55 70v14','none',OUT,3)+star(76,20,.65)}
 else if(n.includes('bow')){s=p('M48 42C10 5 9 70 48 49C84 11 96 75 52 49Z',R)+c(50,47,6,'#eec7ba')+p('M47 51L29 88l22-11 17 11L54 51Z',R)}
 else if(n.includes('stocking')){s=p('M39 20h25v35q5 16-9 28q-16 12-32-2q-9-9-2-19q7-8 18-10Z',R)+rect(35,16,33,15,'#fff8f4')+star(47,59,.6)}
 else if(n.includes('front door')){s=rect(30,22,39,66,'#9d3f32')+rect(34,28,31,56,'#ab4c3a')+c(56,58,2.5,GD)+c(50,42,13,'#388b50')+c(50,42,6,'white','white',2)+p('M41 31l9 5 8-5','none',R,5)}
 else if(n.includes('character')||['mickey mouse','minnie mouse','donald duck','goofy','pluto','stitch','winnie-the-pooh','the grinch','snoopy','olaf'].some(k=>n.includes(k))){s=p('M50 14l9 13 15-3-4 16 11 13-15 6-2 16-14-8-14 8-2-16-15-6 11-13-4-16 15 3Z','#dbeedc')+star(50,50,1.3)+p('M27 78q23 10 46 0','none',R,3)}
 else{s=star(50,49,2.1)+bulbs([[23,26,0],[79,28,1]])}
 return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${s}</svg>`;
}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const query=new URLSearchParams(location.search);const initial=Object.hasOwn(CATALOG,query.get('theme'))?query.get('theme'):'classic';
// Live print jobs carry the precise current clues in their displayed order. No fallback silently substitutes a theme.
function liveJob(){let job=null;const id=query.get('job');if(id&&/^[a-z0-9-]{1,80}$/i.test(id)){try{job=JSON.parse(localStorage.getItem('santaHQPrintJob:'+id)||'null')}catch{}}
 if(!job&&query.has('clues')){try{job={clues:JSON.parse(query.get('clues')||'null'),title:query.get('title')||'Your Lights Hunt',theme:query.get('theme')||'classic'}}catch{}}
 if(!job||!Array.isArray(job.clues)||!job.clues.length||job.clues.length>60)return null;
 const clean=job.clues.map(c=>({name:String(c?.name||'').slice(0,100),hint:String(c?.hint||'').slice(0,180),img:String(c?.img||'').slice(0,250)}));if(clean.some(c=>!c.name))return null;
 return {clues:clean,title:String(job.title||'Your Lights Hunt').slice(0,80),theme:job.theme,source:'live'};}
const live=liveJob();let selected=initial,mode=query.get('all')==='1'?'all':live?'live':'one';
const tree=`<svg class="pine-tree" viewBox="0 0 50 52" aria-hidden="true"><path d="M25 1L13 21h6L8 36h8L11 45h28l-5-9h8L31 21h6Z" fill="#397946" stroke="#21472c" stroke-width="2"/><path d="M24 45v6" stroke="#7e542f" stroke-width="4"/><path d="M16 17l13 0" stroke="#fdfdf8" stroke-width="3"/></svg>`;
const holly=`<svg class="holly" viewBox="0 0 80 45" aria-hidden="true"><path d="M42 24C16 8 16 2 6 1l6 10-12 4 15 4-2 11 18-5Z" fill="#286b37" stroke="#204e2e" stroke-width="2"/><path d="M42 24q31-19 37-3L68 28l5 9-25-5Z" fill="#368046" stroke="#204e2e" stroke-width="2"/><circle cx="40" cy="25" r="6" fill="#bd283e"/><circle cx="50" cy="23" r="6" fill="#bd283e"/><circle cx="44" cy="34" r="6" fill="#bd283e"/></svg>`;
let printImages={};const slug=name=>String(name||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function iconFor(c){
 // Uploaded, correctly named character illustrations are shown in BOTH online and printable hunts.
 const uploaded=printImages[slug(c.name)];
 if(uploaded) return `<img src="${esc(uploaded)}" alt="" style="width:91px;height:96px;object-fit:contain;border-radius:6px">`;
 // Literal color bulbs, music notes, and bulb-letter words use the same drawing online and on paper.
 const special=SantaHQIllustrations.forName(c.name);
 if(special)return special;
 // The original sixteen clue names share the new storybook artwork sprite.
 const idx=CLASSIC_SPRITE.indexOf(c.name);
 if(idx>=0)return `<span class="sprite-window sprite-16"><img src="./hunt-photos.webp?v=20261123-cartoons" style="left:-${idx%4*100}%;top:-${Math.floor(idx/4)*100}%" alt=""></span>`;
 const src=String(c?.img||'');
 if(src){try{const url=new URL(src,location.href);if(url.origin===location.origin&&/^\/hunt-images\/[a-z0-9_.-]+\.(?:webp|png|jpe?g)$/i.test(url.pathname))return `<img src="${esc(url.pathname)}" alt="" style="width:82px;height:86px;object-fit:contain;border-radius:8px">`}catch{}}
 return art(c.name)
}
function sheet(theme,clues,title,part,total){const d=CATALOG[theme]||CATALOG.classic;const custom=title||d.title;const extra=total>1?` · ${part}/${total}`:'';const n=clues.length;
 const cells=clues.map((c,i)=>`<div class="clue" data-long="${c.name.length>16}"><button class="clue-check" type="button" role="checkbox" aria-checked="false" aria-label="Found ${esc(c.name)}"></button><div class="clue-illustration">${iconFor(c)}</div><div class="clue-copy"><div class="clue-title">${esc(c.name)}</div><div class="clue-hint">${esc(c.hint)}</div></div></div>`).join('');
 const bonus=d.bonus||[];
 return `<article class="sheet" data-theme="${esc(theme)}" data-mode="${n>9?'multi':'normal'}"><header class="head" data-title-length="${custom.length>18?'long':'short'}"><div class="head-ornaments">${tree}${tree}</div><div class="brand-crown">Santa HQ</div><b class="head-spark a">✦</b><b class="head-spark b">✦</b><b class="head-spark c">✧</b><b class="head-spark d">✧</b><div class="title-ribbon"><h1>${esc(custom)}${esc(extra)}</h1><h2>Christmas Lights Scavenger Hunt</h2></div><div class="holly left">${holly.replace('class="holly"','class="holly-inner"')}</div><div class="holly right">${holly.replace('class="holly"','class="holly-inner"')}</div><p class="subtitle">Spot each holiday decoration and check it off!</p></header>
 <section class="clues" aria-label="${esc(custom)} clues">${cells}${(clues.length<9?'<div class="clue-empty" aria-hidden="true"><span>✦ ✧ ✦</span></div>':'')}</section>
 <section class="bottom"><div class="bonus"><span class="ribbon">★ Bonus Finds ★</span><ul class="bonus-lines">${bonus.slice(0,3).map(x=>`<li><i aria-hidden="true"></i><span>${esc(x)}</span><span class="bonus-art">${art(x)}</span></li>`).join('')}</ul></div><div class="favorite"><span class="ribbon">My Favorite Find</span><small class="draw-line">Draw your favorite decoration here.</small><svg class="pencil" viewBox="0 0 72 80" aria-hidden="true"><path d="M23 65L47 17l11 8-23 49-16 5z" fill="#f9c55b" stroke="#2b3a2f" stroke-width="2.8"/><path d="M47 17l7-13q4-5 9 0l4 4q3 4-1 8l-8 9" fill="#ed8171" stroke="#2b3a2f" stroke-width="2.8"/><path d="M23 65l-4 14 16-5" fill="#fff3d7" stroke="#2b3a2f" stroke-width="2.8"/><path d="M20 77l3-12 9 8" fill="#3d322e"/><path d="M24 65l10 8M42 27l11 7" stroke="#bd8729" stroke-width="3"/></svg></div><div class="seal"><svg class="seal-outline" viewBox="0 0 170 180" aria-hidden="true"><path d="M85 10Q96 2 106 15Q123 8 132 22Q149 20 152 39Q166 48 159 64Q172 79 161 93Q170 110 156 119Q159 139 139 141Q131 158 113 154Q100 172 84 163Q68 172 56 159Q39 163 31 147Q11 148 14 129Q1 117 11 100Q0 85 13 72Q5 55 21 44Q19 26 37 25Q49 10 64 16Q74 3 85 10Z" fill="#fffaf0" stroke="#b52636" stroke-width="3.8"/><path d="M85 19Q96 12 105 24Q120 18 126 32Q143 31 143 45Q156 54 150 69Q161 81 151 92Q161 107 145 117Q149 135 132 134Q121 149 108 145Q96 159 84 152Q70 161 59 147Q42 153 35 139Q20 141 23 126Q10 115 19 102Q9 86 23 74Q17 58 31 51Q29 37 46 34Q57 21 68 27Q77 14 85 19Z" fill="none" stroke="#e9b65e" stroke-width="1.2"/></svg><span class="small-star">★</span>Hunt<br>Complete!<span class="points">★ ★ ★</span></div></section>
 <div class="footer"><label class="field">Name: <span></span></label><label class="field">Date: <span></span></label><label class="field">Where we looked: <span></span></label></div><div class="safety">Hunt with a grown-up. Stay on sidewalks, watch for cars, and enjoy the lights!</div></article>`}
function render(){let pages=[];if(mode==='all'){pages=Object.entries(CATALOG).map(([theme,d])=>sheet(theme,d.clues,d.title,1,1));}
 else if(mode==='live'&&live){let theme=Object.hasOwn(CATALOG,live.theme)?live.theme:initial;const len=live.clues.length;const size=len>18?10:len>9?8:9;const total=Math.ceil(len/size);for(let i=0;i<total;i++)pages.push(sheet(theme,live.clues.slice(i*size,(i+1)*size),live.title,i+1,total))}
 else {const d=CATALOG[selected];pages=[sheet(selected,d.clues,d.title,1,1)]}
 document.getElementById('sheets').innerHTML=pages.join('');document.getElementById('allBtn').textContent=mode==='all'?'One theme':'All 7 themes';const picker=document.getElementById('themePicker');picker.value=selected;if(live){document.title=live.title+' · Santa HQ Printable';} }
document.getElementById('themePicker').addEventListener('change',e=>{selected=e.target.value;mode='one';render()});document.getElementById('allBtn').addEventListener('click',()=>{mode=mode==='all'?'one':'all';render()});document.getElementById('printBtn').addEventListener('click',()=>window.print());document.getElementById('sheets').addEventListener('click',e=>{const el=e.target.closest('.clue-check');if(!el)return;const v=el.getAttribute('aria-checked')==='true';el.setAttribute('aria-checked',String(!v));el.textContent=v?'':'✓';});render();
(async()=>{try{const r=await fetch('./hunt-images/manifest.json',{cache:'no-store'});if(!r.ok)return;const m=await r.json();if(!m||typeof m!=='object')return;for(const [k,v] of Object.entries(m)){if(/^[a-z0-9-]+$/.test(k)&&typeof v==='string'&&/^\.\/hunt-images\/[a-z0-9-]+\.(?:png|webp|jpe?g)$/i.test(v))printImages[k]=v}if(Object.keys(printImages).length)render()}catch{}})();
</script></body></html>
