<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fffdf8"><title>Printable Christmas Lights Hunts · Santa HQ</title>
<style>
:root{--pine:#27583e;--cran:#a82740;--gold:#bf8428;--ink:#242f29;--muted:#5d6a63;--line:#d6dcd5;--soft:#fff;}
*{box-sizing:border-box}html,body{margin:0}body{font:14px/1.38 Arial,'Helvetica Neue',sans-serif;color:var(--ink);background:#f0f1ec}
button,input,select{font:inherit}.toolbar{margin:0 auto;max-width:900px;padding:16px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:9px;justify-content:space-between;background:#fff;border-bottom:1px solid #d9d9d4}
.toolbar .left,.toolbar .right{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.toolbar label{font-size:12px;font-weight:bold;color:var(--pine)}.toolbar select{max-width:230px;min-height:38px;padding:6px 9px;border-radius:10px;border:1px solid #c7d4c9}.toolbar button{border:1px solid #cbd1cc;border-radius:10px;padding:10px 14px;background:white;font-weight:700;color:var(--pine);cursor:pointer}.toolbar button.primary{background:var(--cran);color:white;border-color:var(--cran)}.toolbar a{text-decoration:none;color:var(--pine);font-size:12px;font-weight:bold}.toolbar .all{background:#f8f3e9}.toolbar .hint{font-size:11px;color:#657066}
#sheets{padding:18px 8px 30px}.sheet{width:8.5in;height:11in;margin:0 auto 16px;padding:.39in .45in .37in;background:#fff;box-shadow:0 4px 27px #18282222;display:flex;flex-direction:column;position:relative;overflow:hidden}
.sheet:before{content:'';position:absolute;inset:.17in;border:1px solid #d5a6a4;border-radius:14px;pointer-events:none}
.sheet:after{content:'';position:absolute;left:.40in;right:.40in;top:.18in;height:2px;background:linear-gradient(90deg, transparent,var(--cran) 15%,var(--gold) 50%,var(--pine) 85%,transparent);pointer-events:none}
.brandrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:4px;padding:0 .10in}.brandmark{font-size:11px;font-weight:900;color:var(--pine);letter-spacing:2px;text-transform:uppercase}.stars{font-size:14px;letter-spacing:10px;color:var(--gold)}
.titleblock{text-align:center;min-height:.99in}.kicker{text-transform:uppercase;font-size:10px;font-weight:800;color:var(--cran);letter-spacing:1.8px}.hunt-title{font-family:Georgia,'Times New Roman',serif;color:var(--cran);font-size:30px;letter-spacing:-.6px;line-height:1.05;margin:6px 0 3px}.subtitle{color:var(--pine);font-size:12px;line-height:1.25;font-weight:600;margin:0}.ornamentrule{height:8px;margin:0 7px 8px;position:relative;border-bottom:1px solid #bdcbb9}.ornamentrule:after{content:'✦';position:absolute;left:calc(50% - 8px);bottom:-12px;color:var(--gold);background:white;padding:0 5px}
.promptline{font-size:11px;text-align:center;margin:11px 0 10px;color:#46554a}.fields{display:grid;grid-template-columns:1.3fr .7fr 1.2fr;gap:12px;margin-bottom:12px;font-size:11px}.field{display:flex;gap:7px;align-items:flex-end;white-space:nowrap;font-weight:700}.field i{flex:1;border-bottom:1px solid #879b8d;height:12px;min-width:20px}
.finds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 11px;flex:none}
.find{height:1.03in;display:flex;align-items:center;gap:10px;border:1.3px solid #d2dbd0;border-radius:12px;padding:11px 9px 9px;position:relative;background:white;break-inside:avoid}
.find:nth-child(4n+1),.find:nth-child(4n+4){border-color:#e8cacc}.check{width:19px;height:19px;min-width:19px;align-self:flex-start;margin-top:1px;border:1.8px solid var(--cran);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;background:white;color:var(--pine);font-size:16px;cursor:pointer}
.find.done .check{border-color:var(--pine)}.find .iconwrap{width:45px;min-width:45px;display:grid;place-items:center}.find svg{width:43px;height:43px;color:var(--pine);fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.find:nth-child(4n+2) svg{color:var(--gold)}.find:nth-child(4n+3) svg{color:var(--cran)}.find-content{min-width:0;flex:1}.find-title{font-family:Georgia,'Times New Roman',serif;font-size:16px;line-height:1.07;font-weight:700;color:var(--ink);word-break:normal}.find-hint{font-size:10px;color:#5f6a62;line-height:1.2;margin-top:5px}
.bottom{display:grid;grid-template-columns:42% 1fr;gap:14px;margin-top:14px;flex:1;min-height:0}.bonus,.favorite{border:1.4px solid #bbc9bb;border-radius:12px;position:relative;padding:34px 12px 12px;min-height:0}.favorite{border-color:#d8a3ac}.ribbon{position:absolute;left:14px;top:-7px;background:var(--pine);color:white;font-size:13px;line-height:1.1;letter-spacing:.2px;font-family:Georgia,serif;font-weight:bold;border-radius:4px;padding:9px 13px}.favorite .ribbon{background:var(--cran)}.bonuslist{margin:1px 0 0;padding:0;list-style:none;display:grid;gap:10px}.bonuslist li{display:flex;gap:9px;align-items:flex-start;font-size:11.5px;color:#334136;line-height:1.35}.minibox{width:15px;height:15px;flex:none;border:1.5px solid var(--pine);border-radius:3px;margin-top:0}.pencil{position:absolute;right:14px;bottom:12px;color:var(--cran)}.pencil svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.6}.caption{position:absolute;left:12px;bottom:10px;color:#a6a8a2;font-size:10px;font-style:italic}
.footer{min-height:.57in;display:flex;gap:10px;justify-content:space-between;align-items:center;padding:10px .09in 0;flex:none}.safety{font-size:9.5px;color:#6b786e;max-width:66%;line-height:1.28}.seal{border:2px dashed var(--cran);color:var(--cran);font-family:Georgia,serif;text-align:center;font-size:14px;font-weight:bold;line-height:1.05;padding:8px 14px;border-radius:28px;transform:rotate(-5deg);white-space:nowrap}.seal span{font-size:10px;color:var(--gold);letter-spacing:2px}
.sheet[data-theme="disney"] .hunt-title{font-size:29px}
@media(max-width:800px){.sheet{transform-origin:top center;max-width:100%;height:auto;min-height:11in;padding:22px 23px;overflow:visible}.sheet:before{inset:10px}.find{min-height:1.03in;height:auto}.find-title{font-size:15px}.bottom{min-height:2in}.titleblock{min-height:.99in}}
@media(max-width:560px){.sheet{padding:21px 15px;min-height:unset}.titleblock{min-height:85px}.hunt-title{font-size:25px}.finds{grid-template-columns:1fr}.find{min-height:82px}.bottom{min-height:220px}.footer{min-height:60px}.seal{font-size:12px}.find-title{font-size:15px}}
@page{size:letter;margin:0}
@media print{html,body{width:8.5in!important;margin:0!important;padding:0!important;background:white!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.toolbar{display:none!important}#sheets{padding:0!important}.sheet{width:8.5in!important;max-width:none!important;height:11in!important;min-height:11in!important;max-height:11in!important;overflow:hidden!important;padding:.39in .45in .37in!important;margin:0!important;box-shadow:none!important;break-after:page;page-break-after:always;transform:none!important}.sheet:last-child{break-after:auto;page-break-after:auto}.finds{grid-template-columns:repeat(2,minmax(0,1fr))!important}.find{height:1.03in!important;min-height:0!important}.find-title{font-size:16px!important}.bottom{min-height:0!important}.footer{min-height:.57in!important}.find .check{cursor:default}}
</style></head>
<body><nav class="toolbar" aria-label="Printable hunts controls"><div class="left"><a href="./index.html">← Santa HQ</a><label for="themePicker">Choose a theme</label><select id="themePicker"><option value="colors">Color Quest</option><option value="disney">Disney Night</option><option value="characters">Character Quest</option><option value="classic">Christmas Classics</option><option value="effects">Light Show Night</option><option value="winter">Winter Wonderland</option><option value="surprise">Holiday Mix</option></select></div><div class="right"><button id="allBtn" class="all" type="button">Show all 7</button><button id="printBtn" type="button" class="primary">Print / save PDF</button></div><div class="hint">Print at 100% or “Fit to page”, US Letter, portrait. Background graphics optional.</div></nav>
<main id="sheets"></main>
<script>
'use strict';
const CATALOG={"colors": {"title": "Color Quest", "subtitle": "Follow the colors, find the glow.", "clues": [{"name": "Red lights", "hint": "Find a red light display"}, {"name": "Green lights", "hint": "Find something glowing green"}, {"name": "Blue lights", "hint": "Find a blue light display"}, {"name": "White lights", "hint": "Find a glowing white display"}, {"name": "Pink or purple lights", "hint": "Find a surprise-colored glow"}, {"name": "Two colors together", "hint": "Find two light colors beside each other"}, {"name": "Rainbow lights", "hint": "Find a display using many colors"}, {"name": "Colorful roof", "hint": "Find a roof outlined in color"}], "bonus": ["A whole house in one color", "A multicolored tree", "A color you did not expect"]}, "disney": {"title": "Disney Night", "subtitle": "Look for familiar friends glowing in the night.", "clues": [{"name": "Mickey Mouse", "hint": "A Mickey Mouse light-up decoration"}, {"name": "Minnie Mouse", "hint": "Minnie Mouse lights or inflatable"}, {"name": "Donald Duck", "hint": "A Donald Duck light-up decoration"}, {"name": "Goofy", "hint": "Goofy illuminated outdoors"}, {"name": "Pluto", "hint": "Pluto in a festive yard display"}, {"name": "Winnie-the-Pooh", "hint": "Pooh lit up for Christmas"}, {"name": "Stitch", "hint": "A Stitch Christmas yard decoration"}, {"name": "Olaf", "hint": "An Olaf decoration glowing with lights"}], "bonus": ["Two characters together", "A character wearing a Santa hat", "A character you had not seen before"]}, "characters": {"title": "Character Quest", "subtitle": "Find the faces hiding in holiday displays.", "clues": [{"name": "Mickey Mouse", "hint": "Spot this character in lights"}, {"name": "Winnie-the-Pooh", "hint": "Spot this character in lights"}, {"name": "The Grinch", "hint": "Spot this character in lights"}, {"name": "Snoopy", "hint": "Spot this character in lights"}, {"name": "Olaf", "hint": "Spot this character in lights"}, {"name": "Santa Claus", "hint": "Spot this character in lights"}, {"name": "Christmas elf", "hint": "Spot this character in lights"}, {"name": "Snowman", "hint": "Spot this character in lights"}], "bonus": ["A character on a roof", "A giant character inflatable", "Two characters in one yard"]}, "classic": {"title": "Christmas Classics", "subtitle": "All the holiday favorites in one mission.", "clues": [{"name": "Christmas tree", "hint": "Find this classic Christmas decoration"}, {"name": "Glowing star", "hint": "Find this classic Christmas decoration"}, {"name": "Candy cane", "hint": "Find this classic Christmas decoration"}, {"name": "Santa Claus", "hint": "Find this classic Christmas decoration"}, {"name": "Snowman", "hint": "Find this classic Christmas decoration"}, {"name": "Reindeer", "hint": "Find this classic Christmas decoration"}, {"name": "Holiday wreath", "hint": "Find this classic Christmas decoration"}, {"name": "Big light-up gift", "hint": "Find this classic Christmas decoration"}], "bonus": ["A red bow", "A stocking decoration", "A front door with lights"]}, "effects": {"title": "Light Show Night", "subtitle": "Look for lights that move, dance, and shine.", "clues": [{"name": "Icicle lights", "hint": "Find this light effect or decoration"}, {"name": "Colorful roof", "hint": "Find this light effect or decoration"}, {"name": "Pink or purple lights", "hint": "Find this light effect or decoration"}, {"name": "Music-synced lights", "hint": "Find this light effect or decoration"}, {"name": "Holiday projector", "hint": "Find this light effect or decoration"}, {"name": "Chasing light pattern", "hint": "Find this light effect or decoration"}, {"name": "Light tunnel or arch", "hint": "Find this light effect or decoration"}, {"name": "Lights spelling a word", "hint": "Find this light effect or decoration"}], "bonus": ["Lights flashing on and off", "Lights moving in a pattern", "A display changing colors"]}, "winter": {"title": "Winter Wonderland", "subtitle": "Bundle up and spot a snowy scene.", "clues": [{"name": "Snowman", "hint": "Find this wintery light display"}, {"name": "Reindeer", "hint": "Find this wintery light display"}, {"name": "Gingerbread person", "hint": "Find this wintery light display"}, {"name": "Penguin", "hint": "Find this wintery light display"}, {"name": "Glowing snowflake", "hint": "Find this wintery light display"}, {"name": "Icicle lights", "hint": "Find this wintery light display"}, {"name": "Giant inflatable", "hint": "Find this wintery light display"}, {"name": "Giant ornament", "hint": "Find this wintery light display"}], "bonus": ["A white-and-blue display", "Snowy decorations on a roof", "A winter animal in lights"]}, "surprise": {"title": "Holiday Mix", "subtitle": "You never know what you will find next.", "clues": [{"name": "Christmas elf", "hint": "Look for this holiday decoration"}, {"name": "Santa sleigh", "hint": "Look for this holiday decoration"}, {"name": "Holiday wreath", "hint": "Look for this holiday decoration"}, {"name": "The Grinch", "hint": "Look for this holiday decoration"}, {"name": "Music-synced lights", "hint": "Look for this holiday decoration"}, {"name": "Pink or purple lights", "hint": "Look for this holiday decoration"}, {"name": "Light-up mailbox", "hint": "Look for this holiday decoration"}, {"name": "Lights spelling a word", "hint": "Look for this holiday decoration"}], "bonus": ["A decoration you have never seen", "Something that makes you laugh", "Your most surprising find"]}};
const ICONS={"star": "<path d=\"m24 4 5.7 11.9L43 18l-9.5 9.4 2.2 13.5L24 34.6 12.3 41l2.2-13.6L5 18l13.3-2.1z\"/>", "lights": "<path d=\"M3 13c10-8 20 6 42-3\"/><path d=\"M9 15v6m0 0a3 3 0 1 0 6 0v-5M24 14v6m0 0a3 3 0 1 0 6 0v-6M37 12v6m0 0a3 3 0 1 0 6 0v-8\"/>", "gift": "<rect x=\"7\" y=\"18\" width=\"34\" height=\"25\" rx=\"3\"/><path d=\"M24 18v25M7 25h34M24 17c-14-1-13-10-7-10 4 0 7 10 7 10zm0 0c14-1 13-10 7-10-4 0-7 10-7 10z\"/>", "tree": "<path d=\"M24 4 9 23h8L6 35h36L31 23h8zM24 35v9M18 44h12\"/>", "candy": "<path d=\"M21 44V17a10 10 0 0 1 20 0v6h-8v-6a2 2 0 0 0-4 0v27z\"/><path d=\"M21 28h8M21 38h8M31 7l6 6\"/>", "house": "<path d=\"m5 21 19-15 19 15v22H5z\"/><path d=\"M14 43V28h11v15M30 26h7v8h-7M10 18l6 6M32 16l7 7\"/>", "snow": "<circle cx=\"24\" cy=\"13\" r=\"8\"/><circle cx=\"24\" cy=\"34\" r=\"13\"/><path d=\"M13 29 3 23m31 6 11-6M22 12h.1M27 12h.1M24 32h.1M24 38h.1\"/>", "snowflake": "<path d=\"M24 4v40M4 24h40M9 9l30 30M39 9 9 39M18 10l6 6 6-6M18 38l6-6 6 6M10 18l6 6-6 6M38 18l-6 6 6 6\"/>", "wreath": "<circle cx=\"24\" cy=\"23\" r=\"15\"/><circle cx=\"24\" cy=\"23\" r=\"7\"/><path d=\"m20 38-5 7 9-4 9 4-5-7M12 15l3 3M33 13l-3 4\"/>", "heart": "<path d=\"M24 42 6 25C-2 15 10 4 20 13l4 4 4-4c10-9 22 2 14 12z\"/>", "spark": "<path d=\"M24 3 29 19l16 5-16 5-5 16-5-16-16-5 16-5z\"/>", "music": "<path d=\"M20 10v27a6 6 0 1 1-4-6V13l22-5v23a6 6 0 1 1-4-6V8\"/>", "circle": "<circle cx=\"24\" cy=\"24\" r=\"16\"/><path d=\"M9 24h30M24 9v30\"/>", "bow": "<path d=\"M23 21C5 8 5 32 22 25c-11 7-9 14-8 17l10-14 10 14c1-3 3-10-8-17 17 7 17-17-1-4\"/><circle cx=\"24\" cy=\"24\" r=\"4\"/>", "paw": "<path d=\"M14 29c-7-3-5 9 2 6m18-6c7-3 5 9-2 6M17 19c-3-8-10-2-4 4m20-4c3-8 10-2 4 4M24 27c-8-8-15 10-7 14 4 3 10-3 14 0 8-4 1-22-7-14z\"/>", "mail": "<rect x=\"8\" y=\"14\" width=\"32\" height=\"24\" rx=\"3\"/><path d=\"m9 17 15 13 15-13\"/>", "camera": "<rect x=\"7\" y=\"13\" width=\"34\" height=\"27\" rx=\"4\"/><circle cx=\"24\" cy=\"27\" r=\"8\"/><path d=\"M15 13l3-6h12l3 6\"/>", "train": "<rect x=\"6\" y=\"17\" width=\"30\" height=\"19\" rx=\"4\"/><path d=\"M12 17V9h18v8m6 7h6v12h-6M12 36l-5 7m24-7 5 7\"/><circle cx=\"15\" cy=\"37\" r=\"3\"/><circle cx=\"29\" cy=\"37\" r=\"3\"/>", "ice": "<path d=\"M24 3v28m-9-17 9 7 9-7M24 31l-9 13h18z\"/>", "hat": "<path d=\"M6 31c6-18 16-25 25-25 6 0 12 3 12 8-11-5-21 4-23 17z\"/><path d=\"M5 30h36v8H5z\"/><circle cx=\"43\" cy=\"15\" r=\"5\"/>", "globe": "<circle cx=\"24\" cy=\"24\" r=\"17\"/><path d=\"M7 24h34M24 7c-11 13-11 21 0 34M24 7c11 13 11 21 0 34\"/>"};
const ICON_FOR={"Red lights": "lights", "Green lights": "lights", "Blue lights": "lights", "White lights": "lights", "Pink or purple lights": "lights", "Two colors together": "lights", "Rainbow lights": "lights", "Colorful roof": "house", "Mickey Mouse": "spark", "Minnie Mouse": "spark", "Donald Duck": "spark", "Goofy": "spark", "Pluto": "paw", "Winnie-the-Pooh": "spark", "Stitch": "spark", "Olaf": "snow", "The Grinch": "spark", "Snoopy": "spark", "Santa Claus": "hat", "Christmas elf": "spark", "Snowman": "snow", "Christmas tree": "tree", "Glowing star": "star", "Candy cane": "candy", "Reindeer": "paw", "Holiday wreath": "wreath", "Big light-up gift": "gift", "Icicle lights": "snowflake", "Music-synced lights": "music", "Holiday projector": "camera", "Chasing light pattern": "spark", "Light tunnel or arch": "house", "Lights spelling a word": "lights", "Gingerbread person": "heart", "Penguin": "snowflake", "Glowing snowflake": "snowflake", "Giant inflatable": "spark", "Giant ornament": "spark", "Santa sleigh": "train", "Light-up mailbox": "mail"};
const page=new URLSearchParams(location.search);
const initialTheme=Object.hasOwn(CATALOG,page.get('theme'))?page.get('theme'):'classic';
const safeClues=(()=>{try{const raw=JSON.parse(page.get('clues')||'null');if(!Array.isArray(raw)||raw.length!==8)return null;const list=raw.map(c=>({name:String(c.name||'').slice(0,65),hint:String(c.hint||'').slice(0,105)}));return list.every(c=>c.name)?list:null}catch{return null}})();
const customTitle=String(page.get('title')||'').slice(0,70);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function findIcon(name){const t=String(name).toLowerCase();if(ICON_FOR[name])return ICON_FOR[name];if(t.includes('snow'))return 'snow';if(t.includes('lights')||t.includes('color'))return 'lights';if(t.includes('tree'))return 'tree';if(t.includes('star'))return 'star';if(t.includes('gift'))return 'gift';return 'spark'}
function svg(name){return `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[findIcon(name)]||ICONS.spark}</svg>`}
function renderSheet(theme, useCustom){const d=CATALOG[theme];const clues=(useCustom&&safeClues)||d.clues;const title=useCustom&&customTitle&&customTitle.length<=30?customTitle:d.title;
return `<article class="sheet" data-theme="${theme}"><div class="brandrow"><span class="brandmark">Santa HQ · North Pole Missions</span><span class="stars" aria-hidden="true">✦ ✧ ✦</span></div><header class="titleblock"><div class="kicker">Christmas Lights Scavenger Hunt</div><h1 class="hunt-title">${esc(title)}</h1><p class="subtitle">${esc(d.subtitle)}</p></header><div class="ornamentrule"></div><p class="promptline">Look for each holiday sight, then check it off. Can you find all eight?</p><div class="fields"><span class="field">Name <i></i></span><span class="field">Date <i></i></span><span class="field">Where we looked <i></i></span></div><section class="finds" aria-label="Scavenger hunt clues">${clues.map((c,i)=>`<div class="find" role="group"><span class="check" role="checkbox" tabindex="0" aria-checked="false" aria-label="Found ${esc(c.name)}"></span><span class="iconwrap">${svg(c.name)}</span><div class="find-content"><div class="find-title">${esc(c.name)}</div><div class="find-hint">${esc(c.hint||'Find this holiday sight')}</div></div></div>`).join('')}</section><div class="bottom"><section class="bonus"><div class="ribbon">Bonus Finds</div><ul class="bonuslist">${d.bonus.map(b=>`<li><span class="minibox"></span><span>${esc(b)}</span></li>`).join('')}</ul></section><section class="favorite"><div class="ribbon">My Favorite Find</div><div class="caption">Draw your favorite holiday decoration here.</div><div class="pencil" aria-hidden="true"><svg viewBox="0 0 36 36"><path d="m5 30 5-11 17-17 7 7-17 17zM10 19l7 7M26 3l7 7M5 30l10-4"/></svg></div></section></div><footer class="footer"><small class="safety">Stay on sidewalks, watch for traffic and leave decorations where they are. Hunt with a grown-up.</small><div class="seal"><span>✦ ✦ ✦</span><br>MISSION<br>COMPLETE!</div></footer></article>`}
let mode=page.get('all')==='1'?'all':'one';let selected=initialTheme;const sheets=document.getElementById('sheets');const picker=document.getElementById('themePicker');picker.value=initialTheme;
function update(){if(mode==='all'){sheets.innerHTML=Object.keys(CATALOG).map(id=>renderSheet(id,false)).join('');document.getElementById('allBtn').textContent='Show one theme'}else{sheets.innerHTML=renderSheet(selected,selected===initialTheme&&!!safeClues);document.getElementById('allBtn').textContent='Show all 7'}}
picker.addEventListener('change',()=>{selected=picker.value;mode='one';update()});document.getElementById('allBtn').addEventListener('click',()=>{mode=mode==='one'?'all':'one';update()});document.getElementById('printBtn').addEventListener('click',()=>window.print());
sheets.addEventListener('click',e=>{const c=e.target.closest('.check');if(c){const chosen=c.getAttribute('aria-checked')==='true';c.setAttribute('aria-checked',String(!chosen));c.textContent=chosen?'':'✓';c.closest('.find').classList.toggle('done',!chosen)}});
sheets.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){const c=e.target.closest('.check');if(c){e.preventDefault();c.click()}}});update();
</script></body></html>
