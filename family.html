<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8fc"><title>Santa HQ · Family gift list</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<style>:root{font-family:'DM Sans',system-ui,sans-serif;color:#25314c;background:#f7f8fc}*{box-sizing:border-box}body{margin:0}.shell{max-width:950px;margin:auto;padding:22px 18px 80px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:8px 0 27px}.brand{font:800 27px Outfit,sans-serif;color:#4c43ab}.brand span{color:#fa788b}.top a{color:#6256cb;font-weight:700;font-size:13px}.hero{background:linear-gradient(115deg,#6555c9,#a295ec);color:#fff;border-radius:27px;padding:33px;margin-bottom:25px}.hero h1{font:800 clamp(30px,5vw,43px)/1.1 Outfit,sans-serif;margin:8px 0}.hero p{color:#f1eaff}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:1.6px;font-weight:800;color:#fff4b7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;border:1px solid #eae9f4;border-radius:22px;padding:22px;box-shadow:0 7px 20px #202a4a08}.card h2{font:800 23px Outfit,sans-serif;margin:0 0 5px}.card p{font-size:12px;color:#8590a4}.gift{display:flex;justify-content:space-between;align-items:center;gap:13px;border-top:1px solid #eff0f7;padding:13px 0}.gift strong{display:block;font-size:13px}.gift small{color:#838aa0}.gift button{border:0;background:#6354c9;color:#fff;padding:8px 12px;font-weight:800;border-radius:10px;white-space:nowrap}.gift button:disabled{background:#eae8f5;color:#656789}.status{margin-top:18px;color:#8c8da3;font-size:12px}.error{background:#ffe9ea;color:#a53d48;padding:13px;border-radius:12px}.hidden{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.hero{padding:24px}.card{padding:18px}}</style></head>
<body><main class="shell"><header class="top"><div class="brand">santa hq<span>.</span></div><a href="./">Make your own Santa HQ</a></header><div id="area">Opening this family's gift list…</div><p class="status">Only gifts approved by the family are shown here. Private Santa HQ plans stay private.</p></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=new URLSearchParams(location.hash.slice(1)).get('list')||'';
async function request(route,data){const r=await fetch(route,{method:data?'POST':'GET',credentials:'omit',cache:'no-store',headers:data?{'Content-Type':'application/json'}:{},...(data?{body:JSON.stringify(data)}:{})});const j=await r.json();if(!r.ok)throw Error(j.error||'Unable to load this list');return j}
function displayChild(x,list){return x==='1'?list.child1:x==='2'?list.child2:x==='both'?'Both kids':'Still deciding'}
let info;
async function refresh(){
try{info=await request('/api/public/list?share='+encodeURIComponent(id));const l=info.list,claimed=new Map(info.claims.map(c=>[c.gift_id,c.name]));
const renderGift=(g,claim)=>`<div class="gift"><div><strong>${esc(g.name)}</strong><small>${esc(displayChild(g.recipient,l))}</small></div>${claim===null?'':claim?`<small>Claimed by ${esc(claim)}</small>`:`<button type="button" data-claim="${esc(g.id)}">I can get this</button>`}</div>`;
document.getElementById('area').innerHTML=`<section class="hero"><span class="eyebrow">A LITTLE CHRISTMAS MAGIC</span><h1>${esc(l.familyName)}'s Christmas list</h1><p>Thanks for making the season special with us!</p></section><div class="grid"><section class="card"><h2>Gift ideas</h2><p>Claim one so other relatives know it is covered.</p>${l.ideas.length?l.ideas.map(g=>renderGift(g,claimed.get(g.id)||'')).join(''):'Nothing to share here yet.'}</section><section class="card"><h2>In Santa's bag</h2><p>A few things already covered.</p>${l.bag.length?l.bag.map(g=>renderGift(g,null)).join(''):'Nothing published in this section.'}</section></div>`;
}catch(err){document.getElementById('area').innerHTML=`<p class="error">${esc(err.message)}</p>`}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-claim]');if(!b)return;const name=prompt('Your first name, so the family knows who claimed this gift:');if(!name?.trim())return;b.disabled=true;try{await request('/api/public/claim',{share:id,giftId:b.dataset.claim,name:name.trim()});await refresh()}catch(err){alert(err.message);b.disabled=false}});
refresh();
</script></body></html>
