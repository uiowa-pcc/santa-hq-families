<style>:root{font-family:'DM Sans',system-ui,sans-serif;color:#25314c;background:#f7f8fc}*{box-sizing:border-box}body{margin:0}.shell{max-width:950px;margin:auto;padding:22px 18px 80px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:8px 0 27px}.brand{font:800 27px Outfit,sans-serif;color:#4c43ab}.brand span{color:#fa788b}.top a{color:#6256cb;font-weight:700;font-size:13px}.hero{background:linear-gradient(115deg,#6555c9,#a295ec);color:#fff;border-radius:27px;padding:33px;margin-bottom:25px}.hero h1{font:800 clamp(30px,5vw,43px)/1.1 Outfit,sans-serif;margin:8px 0}.hero p{color:#f1eaff}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:1.6px;font-weight:800;color:#fff4b7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;border:1px solid #eae9f4;border-radius:22px;padding:22px;box-shadow:0 7px 20px #202a4a08}.card h2{font:800 23px Outfit,sans-serif;margin:0 0 5px}.card p{font-size:12px;color:#8590a4}.gift{display:flex;justify-content:space-between;align-items:center;gap:13px;border-top:1px solid #eff0f7;padding:13px 0}.gift strong{display:block;font-size:13px}.gift small{color:#838aa0}.gift button{border:0;background:#6354c9;color:#fff;padding:8px 12px;font-weight:800;border-radius:10px;white-space:nowrap}.gift button:disabled{background:#eae8f5;color:#656789}.status{margin-top:18px;color:#8c8da3;font-size:12px}.error{background:#ffe9ea;color:#a53d48;padding:13px;border-radius:12px}.hidden{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.hero{padding:24px}.card{padding:18px}}.gift-category{margin:15px 0 0}.gift-category h3{color:#6a5db0;font:800 13px Outfit,sans-serif;margin:0 0 5px}.gift-category .gift:first-of-type{border-top:0}.empty{font-size:12px;color:#9b9aae}.gift{gap:7px;flex-wrap:wrap}
.profile-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:13px;margin:0 0 24px}.profile-card{background:#fff;border:1px solid #eae9f4;padding:17px;border-radius:18px;box-shadow:0 7px 20px #202a4a07}.profile-card h2{margin:0 0 12px;font:800 18px Outfit,sans-serif;color:#5147ad}.profile-card dt{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:#987ab8;font-weight:800}.profile-card dd{margin:5px 0 12px;font-size:13px;white-space:pre-line;line-height:1.55;color:#3c455b}.profile-intro{font:800 22px Outfit,sans-serif;margin:8px 0 14px}

/* Child-first public gift lists. Each child keeps two clearly separated gift lists. */
.child-lists{display:grid;gap:20px}.child-list-card{background:#fff;border:1px solid #eae9f4;border-radius:23px;padding:21px;box-shadow:0 7px 20px #202a4a08}.child-list-head{display:flex;align-items:center;gap:12px;border-bottom:1px solid #efedf5;padding-bottom:15px}.child-list-head h2{font:800 clamp(22px,3vw,27px) Outfit,sans-serif;margin:0 0 4px;color:#37304e}.child-list-head p{margin:0;color:#8b8ba2;font-size:12px}.child-list-icon{display:grid;place-items:center;width:47px;height:47px;flex:none;border-radius:15px;color:#7660b8;background:#f2ecff;font:700 30px Georgia,serif}.child-list-icon[data-child-icon="heart"]{color:#b85285;background:#ffeff6}.child-list-icon[data-child-icon="snow"]{color:#4d80b5;background:#eaf6ff}.child-list-icon[data-child-icon="flower"]{color:#b76a94;background:#fff1f7}.child-list-columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:17px}.child-gift-section{background:#fdfcff;border:1px solid #efedf7;border-radius:16px;padding:16px;min-width:0}.child-gift-section>h3{font:800 19px Outfit,sans-serif;color:#5544a0;margin:0}.child-gift-section>p{font-size:12px;color:#8e91a7;margin:3px 0 11px}.child-gift-section .gift{flex-wrap:nowrap}.child-gift-section .gift strong{overflow-wrap:anywhere;flex:1;min-width:0}.child-gift-section .gift button{padding:8px 10px;font-size:11px}.child-gift-section .gift small.claim-state{text-align:right;font-size:11px;color:#706e88}.child-gift-section .gift-category{margin-top:17px}.child-gift-section .gift-category h4{font:800 12px Outfit,sans-serif;color:#775fae;margin:0 0 4px}.child-gift-section .empty{margin:12px 0 0}.child-profile{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px;margin:15px 0 0}.child-profile>div{padding:12px 13px;border-radius:13px;background:#f7f3ff}.child-profile b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:#765ab2}.child-profile p{margin:5px 0 0;font-size:12px;white-space:pre-line;overflow-wrap:anywhere;color:#53506a;line-height:1.45}@media(max-width:650px){.child-list-card{padding:16px}.child-list-columns{grid-template-columns:1fr;gap:10px}.child-gift-section{padding:14px}.child-list-icon{width:42px;height:42px;font-size:25px}}

/* 12 elf portraits share one image, so the phone loads only one extra asset. */
.elf-avatar{display:inline-grid!important;place-items:center;vertical-align:middle;flex:none!important;width:42px;height:42px;min-width:0!important;min-height:0!important;padding:0!important;box-sizing:border-box;border-radius:13px;overflow:hidden;font-size:0!important;line-height:0!important;background-image:url('./elf-avatars.webp')!important;background-size:400% 300%!important;background-repeat:no-repeat!important;box-shadow:inset 0 0 0 1px #ffffff99}

.fa-icon-row .fa-icon-option,.fa-signup-icons label{line-height:0}

.fa-icon-row .fa-icon-option input:focus-visible + .elf-avatar,.fa-signup-icons input:focus-visible + .elf-avatar{outline:3px solid #e5b957;outline-offset:2px}
.fa-elf-options{display:grid;grid-template-columns:repeat(auto-fill,minmax(53px,1fr));gap:9px;margin-top:11px;margin-bottom:9px}
.fa-elf-caption{font-size:11px;color:#8b8298;font-weight:700;margin-top:7px}
.fa-legacy-picker{margin:11px 0 0}.fa-legacy-picker summary{font-size:12px;font-weight:800;color:#6f6098;cursor:pointer}.fa-legacy-picker .fa-icon-row{margin-top:9px}
.kid-avatar .elf-avatar,.mail-avatar .elf-avatar,.idea-recipient-symbol .elf-avatar,.kid-person .elf-avatar,.plan-score-face .elf-avatar,.morning-colhead .elf-avatar,.mf-profile .elf-avatar{width:41px;height:41px}
.kid-person > span > .elf-avatar{width:39px;height:39px}

.elf-avatar[data-elf="elf-purple-girl"]{background-position:0.00000% 0.00000%!important}

.elf-avatar[data-elf="elf-blue-boy"]{background-position:33.33333% 50.00000%!important}
.elf-avatar[data-elf="elf-teal-boy"]{background-position:66.66667% 50.00000%!important}
.elf-avatar[data-elf="elf-navy-boy"]{background-position:100.00000% 50.00000%!important}
.elf-avatar[data-elf="elf-gold"]{background-position:0.00000% 100.00000%!important}
.elf-avatar[data-elf="elf-mint"]{background-position:33.33333% 100.00000%!important}
.elf-avatar[data-elf="elf-coral"]{background-position:66.66667% 100.00000%!important}
.elf-avatar[data-elf="elf-classic"]{background-position:100.00000% 100.00000%!important}
.child-list-icon.elf-avatar{width:47px!important;height:47px!important;border-radius:15px}
@media(max-width:650px){.child-list-icon.elf-avatar{width:42px!important;height:42px!important}}
 .gift-list{display:grid;gap:0}.gift-list .gift:first-child{border-top:0}.gift-list .gift{min-height:44px;padding:11px 0}

body.santa-family-list{background:#fcf7f6;color:#482b39;font-family:'DM Sans',system-ui,sans-serif}.santa-family-list .shell{max-width:1000px;padding:24px 18px 65px}.santa-family-list .brand{font-family:Fraunces,Georgia,serif;color:#82213f;font-size:27px;letter-spacing:-.055em}.santa-family-list .brand span{color:#b95770}.santa-family-list .top a{color:#902846;background:#fffaf7;border:1px solid #ead5dc;border-radius:999px;padding:9px 13px;text-decoration:none}.santa-family-list .hero{background:radial-gradient(ellipse at 88% 40%,#fff3df,transparent 55%),linear-gradient(115deg,#f5d6de,#fae9e3);border:1px solid #f1d8dc;color:#80203e;position:relative;overflow:hidden;padding:32px 26px;border-radius:23px;box-shadow:0 8px 25px #78324a0c}.santa-family-list .hero:after{content:'✦';position:absolute;right:25px;top:18px;color:#b87a60;font-size:35px;opacity:.65}.santa-family-list .hero h1{font:650 clamp(30px,5vw,48px)/1.08 Fraunces,Georgia,serif!important;letter-spacing:-.045em;color:#81203e;margin:10px 0}.santa-family-list .hero p{color:#795566;max-width:80%;font-size:14px;line-height:1.5}.santa-family-list .eyebrow{color:#904f64}.santa-family-list .child-list-card{background:#fffdfb;border:1px solid #ead9dc;box-shadow:0 7px 22px #73334b0b;border-radius:22px;padding:20px}.santa-family-list .child-list-head{border-bottom:1px solid #eddee2}.santa-family-list .child-list-head h2{font:650 27px Fraunces,Georgia,serif!important;color:#6e3049}.santa-family-list .child-list-head p{color:#755766}.santa-family-list .child-gift-section{background:#fffbf9;border:1px solid #efdee2;border-radius:15px;padding:15px}.santa-family-list .child-gift-section h3{font:650 20px Fraunces,Georgia,serif!important;color:#79354e}.santa-family-list .child-gift-section>p{color:#795d69}.santa-family-list .gift{border-color:#eee0e4;padding:12px 0;min-height:46px}.santa-family-list .gift strong{font-size:14px;color:#4c3440}.santa-family-list .gift button{background:#991c43;border-radius:999px;min-height:40px;padding:9px 12px;font-size:12px}.santa-family-list .gift small.claim-state{color:#775463}.santa-family-list .child-profile>div{background:#f9e9ee;border-radius:12px}.santa-family-list .child-profile b{color:#8e3e5d}.santa-family-list .child-profile p{color:#604653}.santa-family-list .empty,.santa-family-list .status{color:#795f6c}.santa-family-list button:focus-visible,.santa-family-list a:focus-visible{outline:2px solid #98284b;outline-offset:3px}@media(max-width:650px){.santa-family-list .shell{padding:14px 13px 50px}.santa-family-list .hero{padding:24px 18px}.santa-family-list .hero:after{font-size:23px;right:14px;top:10px}.santa-family-list .top{padding-bottom:15px}.santa-family-list .top a{font-size:11px}.santa-family-list .child-list-card{padding:14px}.santa-family-list .child-list-head h2{font-size:23px}.santa-family-list .child-gift-section{padding:12px}}
</style><style id="family-shopping-links">

<body class="santa-family-list"><main class="shell"><header class="top"><div class="brand">santa hq<span>.</span></div><a href="./">Make your own Santa HQ</a></header><div id="area">Opening this family's gift list…</div><p class="status">Only gifts approved by the family are shown here. Private Santa HQ plans stay private.</p></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=new URLSearchParams(location.hash.slice(1)).get('list')||'';
async function request(route,data){const r=await fetch(route,{method:data?'POST':'GET',credentials:'omit',cache:'no-store',headers:data?{'Content-Type':'application/json'}:{},...(data?{body:JSON.stringify(data)}:{})});const j=await r.json();if(!r.ok)throw Error(j.error||'Unable to load this list');return j}
function childrenFor(list){
 const saved=Array.isArray(list.children)?list.children.filter(c=>c&&c.name):[];
 return saved.length?saved:[{id:'1',name:list.child1||'Child 1',icon:'star'},{id:'2',name:list.child2||'Child 2',icon:'heart'}];
}
const childIcons={star:'★',heart:'♥',flower:'✿',moon:'☾',sparkle:'✦',snow:'❄'};
const elfIcons={'elf-purple-girl':'Purple girl elf','elf-pink-girl':'Pink girl elf','elf-red-girl':'Red girl elf','elf-lilac-girl':'Lilac girl elf','elf-green-boy':'Green boy elf','elf-blue-boy':'Blue boy elf','elf-teal-boy':'Teal boy elf','elf-navy-boy':'Navy boy elf','elf-gold':'Golden elf','elf-mint':'Mint elf','elf-coral':'Coral elf','elf-classic':'Classic elf'};

function shoppingLink(value){
 if(typeof value!=='string'||value.length>2048)return '';
 try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)&&u.hostname&&!u.username&&!u.password?u.href:'';}catch{return '';}
}
function groupGifts(gifts,claims,allowClaims){
 if(!gifts.length)return `<p class="empty">${allowClaims?'No gift ideas shared yet.':"Nothing in Santa’s Bag yet."}</p>`;
 return `<div class="gift-list">${gifts.map(g=>{
   const claim=claims.get(g.id);
   const controls=!allowClaims?'':claim?`<small class="claim-state">Claimed by ${esc(claim)}</small>`:`<button type="button" data-claim="${esc(g.id)}">I can get this</button>`;
   const link=allowClaims?shoppingLink(g.link):'';
   const shop=link?`<a class="gift-shop" href="${esc(link)}" target="_blank" rel="noopener noreferrer" aria-label="Shop ${esc(g.name)} (opens in a new tab)">Shop gift <svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"/></svg></a>`:'';
   return `<div class="gift"><strong>${esc(g.name)}</strong><div class="gift-list-actions">${shop}${controls}</div></div>`;
 }).join('')}</div>`;
}
function profileFor(child,list){
 const profile=(Array.isArray(list.profiles)?list.profiles:[]).find(p=>p&&(String(p.id)===String(child.id)||p.name===child.name));
 if(!profile)return '';
 const rows=[['Favorite colors',profile.favoriteColors],['Favorite characters',profile.favoriteCharacters],['Favorite activities',profile.favoriteActivities],['Favorite things',profile.favoriteThings],['Previous interests',profile.interests],['Previous favorites',profile.favorites]].filter(([,v])=>String(v||'').trim());
 if(!rows.length)return '';
 return `<div class="child-profile">${rows.map(([label,value])=>`<div><b>${esc(label)}</b><p>${esc(value)}</p></div>`).join('')}</div>`;
}
function childList(child,ideas,bag,claims,list){
 const displayIcon=childIcons[child.icon]||'✦';
 const avatar=elfIcons[child.icon]?`<span class="child-list-icon elf-avatar" data-elf="${esc(child.icon)}" aria-hidden="true"></span>`:`<span class="child-list-icon" data-child-icon="${esc(child.icon||'sparkle')}" aria-hidden="true">${displayIcon}</span>`;
 return `<section class="child-list-card" aria-label="Gift list for ${esc(child.name)}">
  <header class="child-list-head">${avatar}<div><h2>${child.id==='both'?'Shared family gifts':child.id==='other'?'Other gift ideas':`${esc(child.name)}'s list`}</h2><p>${ideas.length} gift idea${ideas.length===1?'':'s'} · ${bag.length} in Santa's Bag</p></div></header>
  ${profileFor(child,list)}
  <div class="child-list-columns"><section class="child-gift-section"><h3>Gift ideas</h3><p>Shop gift ideas and claim the ones you plan to buy</p>${groupGifts(ideas,claims,true)}</section>
  <section class="child-gift-section"><h3>In Santa's Bag</h3><p>Surprises already taken care of</p>${groupGifts(bag,claims,false)}</section></div>
 </section>`;
}
function familyLists(list,claims){
 const kids=childrenFor(list),ideas=Array.isArray(list.ideas)?list.ideas:[],bag=Array.isArray(list.bag)?list.bag:[];
 const cards=kids.map(c=>childList(c,ideas.filter(g=>String(g.recipient)===String(c.id)),bag.filter(g=>String(g.recipient)===String(c.id)),claims,list));
 const sharedIdeas=ideas.filter(g=>g.recipient==='both'),sharedBag=bag.filter(g=>g.recipient==='both');
 if(sharedIdeas.length||sharedBag.length)cards.push(childList({id:'both',name:'Shared family',icon:'sparkle'},sharedIdeas,sharedBag,claims,list));
 const assigned=new Set([...kids.map(c=>String(c.id)),'both']);
 const otherIdeas=ideas.filter(g=>!assigned.has(String(g.recipient))),otherBag=bag.filter(g=>!assigned.has(String(g.recipient)));
 if(otherIdeas.length||otherBag.length)cards.push(childList({id:'other',name:'Other',icon:'sparkle'},otherIdeas,otherBag,claims,list));
 return `<div class="child-lists">${cards.join('')}</div>`;
}
let info;
async function refresh(){
 try{
  info=await request('/api/public/list?share='+encodeURIComponent(id));const l=info.list,claimed=new Map(info.claims.map(c=>[c.gift_id,c.name]));
  document.getElementById('area').innerHTML=`<section class="hero"><span class="eyebrow">A LITTLE CHRISTMAS MAGIC</span><h1>${esc(l.familyName)}'s Christmas list</h1><p>Browse each child's gift ideas, shop available links, and claim gifts to avoid duplicates.</p></section>${familyLists(l,claimed)}`;
 }catch(err){document.getElementById('area').innerHTML=`<p class="error">${esc(err.message)}</p>`}
}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-claim]');if(!b)return;const name=prompt('Your first name, so the family knows who claimed this gift:');if(!name?.trim())return;b.disabled=true;try{await request('/api/public/claim',{share:id,giftId:b.dataset.claim,name:name.trim()});await refresh()}catch(err){alert(err.message);b.disabled=false}});
refresh();
</script></body></html>
